function niceTop(max) {
  if (max <= 2) return 2;

/* rows: [{ start, value, title }]; one point per period, a line through them, three dates under it */
function lineChart(rows, period) {
  const top = niceTop(Math.max(0, ...rows.map(r => r.value)));

  const xs = rows.map((r, i) => rows.length > 1 ? 100 * i / (rows.length - 1) : 50);
  const ys = rows.map(r => 100 - 100 * r.value / top);
  const pts = xs.map((x, i) => `${x.toFixed(2)},${ys[i].toFixed(2)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${xs[xs.length - 1].toFixed(2)},100 L${xs[0].toFixed(2)},100 Z`;
  const last = rows.length - 1;
  const ticks = rows.length > 2 ? [rows[0], rows[Math.floor(rows.length / 2)], rows[last]] : rows;
  const data = esc(JSON.stringify(rows.map((r, i) => [xs[i], ys[i], r.title])));
  return `<div class="lc"><div class="lc-plot" role="img" aria-label="${esc(rows.map(r => r.title).join('; '))}" data-points="${data}">

        <line class="lc-grid" x1="0" x2="100" y1="0" y2="0"/><line class="lc-grid" x1="0" x2="100" y1="50" y2="50"/><line class="lc-grid" x1="0" x2="100" y1="100" y2="100"/>

      <span class="lc-dot" style="left:${xs[last]}%;top:${ys[last]}%"></span>
      <span class="lc-end" style="left:${xs[last]}%;top:${ys[last]}%">${n(rows[last].value)}</span>
      <span class="lc-cross"></span><span class="lc-dot lc-hdot"></span><span class="lc-tip"></span>
    </div>

}

/* a datetime-local value is local time; '' or nonsense gives NaN */
const draftStart = (d, now) => d.start === 'now' ? now : new Date(d.startLocal).getTime();
function draftProblems(d, now) {
  const p = [];
  if (draftLangs(d).some(l => !d.body[l].trim())) p.push('p_empty');
  if (draftLangs(d).some(l => M.unknownImages(d.body[l], d.images).length)) p.push('p_images');
  if (!Number.isInteger(d.days) || d.days < 1 || d.days > 365) p.push('p_days');

}
function draftToRecord(d, now) {
  const langs = draftLangs(d), startAt = draftStart(d, now);
  return { langs, body: Object.fromEntries(langs.map(l => [l, d.body[l]])), startAt, endAt: M.endFrom(startAt, d.days), replace: d.replace, newAccounts: d.newAccounts };

/* toolbar: change the text box's selection, then keep state and preview in step */
function applyTool(kind, l) {
  const ta = document.querySelector(`textarea[data-draft-lang="${l}"]`);
  if (!ta) return;
  if (kind === 'image') {
    /* on an image's line the image button edits that image; elsewhere it picks a new one */
    const d = state.draft, line = ta.value.slice(0, ta.selectionStart).split('\n').length - 1, im = M.parseImage(ta.value.split('\n')[line] || '');
    if (im && d.images.has(im.id)) { d.pick = { lang: l, line, id: im.id, rec: d.images.get(im.id), alt: im.alt, zoom: im.zoom, size: im.size, center: im.center }; render(); return; }
    d.pickLang = l; d.pickAt = ta.selectionStart; $('img-file').click(); return;
  }
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, sel = v.slice(s, e);
  const wrap = (a, b, ph) => { const inner = sel || ph; ta.setRangeText(a + inner + b, s, e, 'end'); ta.setSelectionRange(s + a.length, s + a.length + inner.length); };
  if (kind === 'center') {
    /* -> line <- on every line the selection touches; when they are all centred already, undo it */
    const a = v.lastIndexOf('\n', s - 1) + 1, bEnd = v.indexOf('\n', e), b = bEnd < 0 ? v.length : bEnd;
    const lines = v.slice(a, b).split('\n'), isC = x => /^->\s*.*?\s*<-$/.test(x.trim());
    const undo = lines.filter(x => x.trim()).every(isC);
    const out = lines.map(x => !x.trim() ? x : undo ? x.trim().replace(/^->\s*/, '').replace(/\s*<-$/, '') : isC(x) ? x : `-> ${x.trim()} <-`).join('\n');
    ta.setRangeText(out, a, b, 'end'); ta.setSelectionRange(a, a + out.length);
  } else if (kind === 'bold') wrap('**', '**', t('f_bold').toLowerCase());
  else if (kind === 'italic') wrap('*', '*', t('f_italic').toLowerCase());
  else if (kind === 'link') {
    const text = sel || 'link';
    ta.setRangeText(`[${text}](https://)`, s, e, 'end');
    const at = s + text.length + 3; ta.setSelectionRange(at, at + 8);
  } else {

    const a = v.lastIndexOf('\n', s - 1) + 1, bEnd = v.indexOf('\n', e), b = bEnd < 0 ? v.length : bEnd;

}

async function loadAdminMessages() {

/* the updates that bring every other message's replacedBy/replacedAt in line with `repl` */
function replUpdates(others, repl, b, F, fs) {
  for (const m of others) {
    const want = repl.get(m.id);
    if (sameRepl(m, want)) continue;
    b.update(F.doc(fs, 'messages', m.id), want ? { ...want } : { replacedBy: F.deleteField(), replacedAt: F.deleteField() });
  }

async function saveDraft() {
  const d = state.draft, now = Date.now();
  d.err = null; d.note = '';

  const editing = d.editing ? state.messages.find(m => m.id === d.editing) : null;
  if (d.editing && (!editing || editing.startAt <= now)) { d.confirming = false; d.note = 'already_started'; return updateActions(); }
  pruneImages(d);
  const used = draftRefs(d), saveImages = new Map([...d.images].filter(([imgId]) => used.has(imgId)));
  const id = d.editing || newMsgId();
  const rec = { ...draftToRecord(d, now), createdAt: editing ? editing.createdAt : now };
  const others = state.messages.filter(m => m.id !== id);
  const repl = M.replacements([...others, M.clean(id, rec)], now);
  const own = repl.get(id);
  d.busy = true; updateActions();
  try {
    if (state.demo) {
      state.messages = [...others.map(m => withRepl(m, repl.get(m.id))), M.clean(id, { ...rec, ...(own || {}) })];
      state.demoImages.set(id, saveImages);
    } else {
      const { F, fs } = fb, b = F.writeBatch(fs);
      b.set(F.doc(fs, 'messages', id), { ...rec, ...(own || {}) });
      for (const [imgId, im] of saveImages) b.set(F.doc(fs, 'messages', id, 'images', imgId), { data: im.data, w: im.w, h: im.h, startAt: rec.startAt });
      for (const imgId of d.loadedImages || []) if (!saveImages.has(imgId)) b.delete(F.doc(fs, 'messages', id, 'images', imgId));

}

  'msg-remove': el => { state.removing = el.dataset.v; render(); },
  'msg-remove-no': () => { state.removing = null; render(); },
  'msg-remove-yes': el => removeMessage(el.dataset.v),
});

/* ---------- screens ---------- */
function loginView() {
  return `<section class="card auth"><div><h1>Admin</h1><p class="lede">${bt('login_lede')}</p></div>
    <form id="login-form" novalidate>
      <label class="field"><span>${bt('email')}</span><input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="field"><span>${bt('password')}</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" role="alert">${errHtml()}</p>
      <button class="btn primary" type="submit">${bt('sign_in')}</button>
    </form></section>`;
}
const noAccessView = () => `<section class="card auth"><div><h1>${bt('no_access')}</h1><p class="lede">${bt('no_access_p')}</p>
  ${ADMIN_UID ? '' : `<p class="muted">${bt('no_admin')}</p>`}</div></section>`;
const errorView = () => `<section class="adm"><div class="notice"><p>${errHtml()}</p><button class="btn small" type="button" data-action="retry">${bt('retry')}</button></div></section>`;

function render() {
  const dash = state.view === 'dash';
  document.documentElement.lang = lang;
  for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  renderTheme();
  $('app-link').innerHTML = bt('to_app');
  $('refresh-btn').innerHTML = bt('refresh');
  $('out-btn').innerHTML = bt('sign_out');
  $('out-btn').hidden = !(fb && fb.auth.currentUser);
  $('refresh-btn').hidden = !dash || state.demo;
  $('status').innerHTML = dash ? (state.demo ? bt('demo') : bt('updated', timeFmt.format(state.loadedAt))) : '';
  const tab = currentTab();
  $('tabs').innerHTML = dash ? TABS.map(k => `<a href="#${k}"${k === tab ? ' aria-current="page"' : ''}>${bt(k)}</a>`).join('') : '';
  $('main').innerHTML = state.view === 'login' ? loginView()
    : state.view === 'noaccess' ? noAccessView()
    : state.view === 'error' ? errorView()
    : dash ? VIEWS[tab]()
    : `<p class="loading">${bt('loading')}</p>`;
}

/* ---------- data ---------- */
/* Every record of every account, via collection-group queries (allowed for the admin only by firestore.rules).
   buildDataset drops names, titles and notes, so they never stay in memory. */
async function load() {
  state.view = 'loading'; render();
  const { F, fs } = fb;
  const rows = snap => snap.docs.flatMap(d => {
    const user = d.ref.parent.parent;
    return user && user.parent.id === 'users' ? [{ uid: user.id, id: d.id, data: d.data() }] : [];
  });
  try {
    const [profiles, children, activities] = await Promise.all(['profile', 'children', 'activities'].map(c => F.getDocs(F.collectionGroup(fs, c)).then(rows)));
    state.accounts = S.buildDataset({ profiles, children, activities }, TIER_KEYS);
    state.seen = M.seenCounts(profiles);
    await loadAdminMessages();
    state.loadedAt = Date.now();
    state.view = 'dash';
  } catch (e) {
    state.err = { key: 'load_failed', code: e && e.code };
    state.view = 'error';
  }
  render();
}

/* Without a Firebase config (python tools/serve.py without --live) the page shows made-up accounts. */
function demoRaw(now) {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const raw = { profiles: [], children: [], activities: [] };
  for (let i = 1; i <= 40; i++) {
    const uid = 'demo' + String(i).padStart(3, '0') + 'xxxxxxxxxxxxxxxxxxx';
    const signup = now - Math.floor(rnd() * 420) * S.DAY;
    const quiet = rnd() < 0.3;
    const last = quiet ? signup + Math.floor(rnd() * 20) * S.DAY : now - Math.floor(rnd() * 25) * S.DAY;
    if (i % 5) raw.profiles.push({ uid, id: 'main', data: { email: `ouder${i}@voorbeeld.be`, createdAt: signup, lastSeen: Math.min(now, last) } });
    const kids = Math.floor(rnd() * 4);
    for (let k = 0; k < kids; k++) raw.children.push({ uid, id: 'c' + k, data: { name: 'x', tier: pick(TIER_KEYS), createdAt: signup + k * S.DAY, updatedAt: last,
      mastered: Object.fromEntries(Array.from({ length: Math.floor(rnd() * 30) }, () => [pick(BUILTIN_GOALS).id, '2026-01-01'])) } });
    const acts = kids ? Math.floor(rnd() * (quiet ? 8 : 150)) : 0;
    for (let a = 0; a < acts; a++) {
      const at = signup + rnd() * Math.max(S.DAY, Math.min(now, last) - signup);
      raw.activities.push({ uid, id: 'a' + a, data: { title: 'x', createdAt: at, updatedAt: at, childIds: ['c' + Math.floor(rnd() * kids)],
        goalIds: Array.from({ length: 1 + Math.floor(rnd() * 3) }, () => pick(BUILTIN_GOALS).id), photoIds: rnd() < 0.35 ? ['p1', 'p2'].slice(0, 1 + Math.floor(rnd() * 2)) : [] } });
    }
  }
  raw.children.push({ uid: 'demo001xxxxxxxxxxxxxxxxxxx', id: 'ex', data: { name: 'Voorbeeld', example: true, createdAt: now } });
  return raw;
}

async function start() {
  if (!FIREBASE_CONFIG) {
    state.demo = true; state.accounts = S.buildDataset(demoRaw(Date.now()), TIER_KEYS); state.loadedAt = Date.now(); state.view = 'dash';
    return render();
  }
  try {
    const [appM, authM, fsM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
    const cfg = { ...FIREBASE_CONFIG }, emu = cfg.emulator; delete cfg.emulator;
    const app = appM.initializeApp(cfg);
    fb = { auth: authM.getAuth(app), fs: fsM.getFirestore(app), A: authM, F: fsM };
    if (emu) { authM.connectAuthEmulator(fb.auth, emu.auth, { disableWarnings: true }); fsM.connectFirestoreEmulator(fb.fs, emu.host, emu.port); }
    authM.onAuthStateChanged(fb.auth, user => {
      state.err = null;
      if (!user) { state.accounts = []; state.view = 'login'; render(); }
      else if (!ADMIN_UID || user.uid !== ADMIN_UID) { state.view = 'noaccess'; render(); }
      else load();
    });
  } catch (e) {
    state.err = { key: 'sdk_fail' }; state.view = 'error'; render();
  }
}

/* ---------- events ---------- */
/* line charts: the crosshair snaps to the nearest period under the pointer */
document.addEventListener('pointermove', e => {
  const plot = e.target.closest && e.target.closest('.lc-plot');
  document.querySelectorAll('.lc-plot.hover').forEach(p => { if (p !== plot) p.classList.remove('hover'); });
  if (!plot) return;
  const pts = JSON.parse(plot.dataset.points), box = plot.getBoundingClientRect();
  const fx = 100 * (e.clientX - box.left) / box.width;
  const [x, y, title] = pts.reduce((a, b) => Math.abs(b[0] - fx) < Math.abs(a[0] - fx) ? b : a);
  plot.classList.add('hover');
  plot.querySelector('.lc-cross').style.left = x + '%';
  Object.assign(plot.querySelector('.lc-hdot').style, { left: x + '%', top: y + '%' });
  const tip = plot.querySelector('.lc-tip');
  tip.textContent = title;
  tip.style.left = Math.min(Math.max(x, 12), 88) + '%';
});
document.addEventListener('pointerleave', e => { if (e.target.classList && e.target.classList.contains('lc-plot')) e.target.classList.remove('hover'); }, true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el);
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const f = e.target;
  try { await fb.A.signInWithEmailAndPassword(fb.auth, f.email.value.trim(), f.password.value); }
  catch (err) { state.err = { key: 'login_failed' }; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'acc-q') { state.q = e.target.value; updateTable(); } });
window.addEventListener('hashchange', render);
$('theme-btn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
  renderTheme();
});
$('lang-switch').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  setFormats();
  render();
});
renderTheme();
$('refresh-btn').addEventListener('click', () => load());
$('out-btn').addEventListener('click', () => fb.A.signOut(fb.auth));
start();
})();
</script>
