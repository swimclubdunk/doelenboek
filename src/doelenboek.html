<title>doelenboek.be</title>
<!-- tools/build.py inlines these stylesheets; everything visual lives in design/ -->
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/app.css">
<link rel="stylesheet" href="core.css">
<!-- bright unless dark was chosen last time; applied before the page is drawn (see the theme button) -->
<script>let t = 'light'; try { if (localStorage.getItem('doelenboek.theme') === 'dark') t = 'dark'; } catch (e) {} document.documentElement.dataset.theme = t;</script>

<header class="top">
  <div class="top-inner">
    <div class="brand"><b>doelenboek.be</b></div>
    <nav class="tabs" aria-label="Doelenboek">
      <a href="#overzicht" data-tab="overzicht">Overzicht</a>
      <a href="#activiteiten" data-tab="activiteiten">Activiteiten</a>
      <a href="#doelen" data-tab="doelen">Minimumdoelen</a>
    </nav>
    <div class="top-right">
      <span class="status" id="status">Verbinden…</span>
      <div class="lang-switch" role="group" id="lang-switch" aria-label="Taal / Language">
        <button type="button" data-lang="nl" aria-pressed="true" lang="nl" title="Nederlands">NL</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en" title="English">EN</button>
      </div>
      <button type="button" class="theme-btn" id="theme-btn"></button>
      <button class="btn small ghost" id="data-btn" type="button">Gegevens</button>
    </div>
  </div>
</header>
<main id="main"><p class="loading">Gegevens laden…</p></main>
<footer class="site-foot" id="site-foot">
  <p id="foot-data"></p>
  <p class="support"><span id="support-text"></span> <a id="support-link" href="https://ko-fi.com/mat644" target="_blank" rel="noopener"></a></p>
</footer>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<dialog id="thanks" class="thanks" aria-labelledby="thanks-h"></dialog>
<dialog id="lightbox" class="lightbox">
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  <button type="button" class="lb-btn lb-prev" data-lb="prev">‹</button>
  <button type="button" class="lb-btn lb-next" data-lb="next">›</button>
  <button type="button" class="btn small lb-close" data-lb="close">Sluiten</button>
</dialog>
<div class="peek" id="peek" hidden><img alt=""></div>
<div class="gpeek" id="gpeek" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  if (mode === 'loading') { st.innerHTML = bt('st_connecting'); st.className = 'status'; }
  else if (mode === 'db' && fbUser) { st.innerHTML = `<span class="status-email">${esc(fbUser.email)}</span>`; st.title = t('signed_in_as', fbUser.email); st.className = 'status ok'; }
  else if (mode === 'db') { st.innerHTML = bt(canWrite ? 'st_saved' : 'st_readonly'); st.className = 'status ok'; }
  else { st.innerHTML = bt('st_local'); st.className = 'status warn'; }
  for (const a of document.querySelectorAll('[data-tab]')) {
    a.innerHTML = bt('tab_' + a.dataset.tab);
    const active = a.dataset.tab === ui.view || (ui.view === 'kind' && a.dataset.tab === 'overzicht');
    if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
}

function render() {
  document.body.classList.toggle('readonly', !canWrite);
  renderChrome();
  const main = $('#main');
  const ae = document.activeElement;
  const fid = ae && main.contains(ae) && ae.id ? ae.id : null;
  let s0 = null, s1 = null; try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) {}

  if (mode === 'auth') {
    main.innerHTML = authView();
    const el = fid && document.getElementById(fid); if (el) el.focus({ preventScroll: true });
    return;
  }
  if (mode === 'loading' || (mode === 'db' && !COLS.every(c => loaded[c]))) { main.innerHTML = `<p class="loading">${esc(t('loading'))}</p>`; return; }
  const cov = buildCoverage();
  let html;
  if (ui.view === 'kind') html = viewChild(cov);
  else if (ui.view === 'activiteiten') html = viewActivities();
  else if (ui.view === 'doelen') html = viewGoals(cov);
  else html = viewOverview(cov);
  hidePeek();
  main.innerHTML = html;
  hydratePhotos(main);

  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} } }
}

/* Banners shown at the top of every main view. */
function exampleBanner() {
  if (!exampleItems().length) return migrationNotice();
  return `<div class="notice"><p>${t('example_banner')}</p><button class="btn small w" data-action="remove-examples">${bt('remove_examples')}</button></div>`;
}
function noGoalsNotice() {
  if (data.goals.size) return '';
  return `<div class="notice"><p>${esc(t('no_goals_notice'))}</p><a class="btn small w" href="#doelen">${bt('add_goal')}</a></div>`;
}

/* The bar and n/tot are mastered goals (bounded); the × number is activity tags (unbounded). */
const touchNum = (label, n) => `<span class="touch${n ? '' : ' zero'}" title="${esc(t('touches_title', label, n))}">${n ? `${n}×` : '—'}</span>`;
function barRow(label, key, n, tot, touches) {
  const p = tot ? Math.round(100 * n / tot) : 0;
  return `<li class="${tot ? '' : 'none'}"><span class="b-lbl">${esc(label)}</span><span class="bar" role="img" aria-label="${esc(t('bar_aria', label, n, tot))}"><i style="width:${p}%;background:${sv(key)}"></i></span><span class="b-num">${tot ? `${n}/${tot}` : '—'}</span>${touchNum(label, touches)}</li>`;
}

function viewOverview(cov) {
  const kids = sortedChildren(), totals = subjectTotals(), total = data.goals.size;
  let h = exampleBanner();
  h += `<section class="page-head"><div><h1>${esc(t('h_overview'))}</h1><p class="lede">${esc(t('n_children', kids.length))} · ${esc(t('n_goals', total))} · ${esc(t('n_acts', data.activities.size))}</p></div>
    <div class="head-actions w"><button class="btn" data-action="add-child">${bt('add_child')}</button></div></section>`;
  h += noGoalsNotice();
  if (!kids.length) {
    return h + `<div class="empty"><h2>${esc(t('empty_kids_h'))}</h2><p>${esc(t('empty_kids_p'))}</p><button class="btn primary w" data-action="add-child">${bt('add_child')}</button></div>`;
  }
  h += `<div class="child-grid">${kids.map(c => {
    const acts = activitiesFor(c.id), mast = masteredOf(c);
    const per = countBySubject(mast), touches = touchesBySubject(cov.get(c.id));
    return `<article class="card child-card">
      <header class="cc-head"><span class="avatar lg" aria-hidden="true">${animalArt(c.animal)}</span>
        <div class="cc-id"><h2>${esc(c.name)}</h2><p class="meta">${esc(t('n_acts', acts.length))}${acts[0] ? '<br>' + esc(t('last', fmtDate(acts[0].date))) : ''}</p></div>
        <div class="cc-pct"><strong>${mast.size}<small>/${total}</small></strong><span>${esc(t('mastered_lbl'))}</span></div></header>
      <ul class="bars">${SUBJECTS.map(s => barRow(sName(s.key), s.key, per[s.key] || 0, totals[s.key] || 0, touches[s.key] || 0)).join('')}</ul>
      <footer class="cc-foot"><button class="btn small ghost" data-action="open-child" data-id="${esc(c.id)}">${bt('goals_per_subject')}</button><button class="btn small ghost w cc-del" data-action="delete-child" data-id="${esc(c.id)}" aria-label="${esc(t('child_del_h'))}" title="${esc(t('child_del_h'))}">${ICON_TRASH}</button></footer>
    </article>`;
  }).join('')}</div>`;
  return h;
}

function viewChild(cov) {
  const c = data.children.get(ui.childId);
  if (!c) { ui.view = 'overzicht'; return viewOverview(cov); }
  const m = cov.get(c.id) || new Map(), mast = masteredOf(c), totals = subjectTotals(), total = data.goals.size;
  const goals = sortedGoals(), acts = activitiesFor(c.id), touches = touchesBySubject(m), q = norm(ui.kidSearch);
  const tab = ui.kidTab;
  const inTab = g => tab === 'all' || mast.has(g.id) === (tab === 'mastered');
  let h = `<button class="btn small ghost back" data-action="back">${bt('back')}</button>
    <section class="kid-head"><span class="avatar lg" aria-hidden="true">${animalArt(c.animal)}</span>
      <div class="kid-name"><h1>${esc(c.name)}</h1><p class="lede">${esc(t('reached', mast.size, total))} · ${esc(t('n_touches', sumValues(touches)))} · ${esc(t('n_acts', acts.length))}</p></div>
      <div class="head-actions"><button class="btn primary w" data-action="new-activity" data-child="${esc(c.id)}">${bt('add_activity')}</button><button class="btn w" data-action="edit-child" data-id="${esc(c.id)}">${bt('edit')}</button></div>
    </section>`;
  h += noGoalsNotice();
  if (!total) return h;
  const segBtn = (key, n) => `<button role="tab" data-action="kid-tab" data-tab="${key}" aria-selected="${tab === key}">${bt('tab_' + key)} <span class="seg-n">${n}</span></button>`;
  h += `<div class="toolbar kid-tools">
      <div class="seg" role="tablist" aria-label="${esc(t('goals_aria'))}">${segBtn('all', total)}${segBtn('todo', total - mast.size)}${segBtn('mastered', mast.size)}</div>
      <input class="search" id="kid-search" type="search" placeholder="${esc(t('search_kid'))}" value="${esc(ui.kidSearch)}" aria-label="${esc(t('search_kid'))}">
    </div>`;
  let shownAny = false;
  for (const s of SUBJECTS) {
    const sg = goals.filter(g => g.subject === s.key);
    if (!sg.length) continue;
    const n = sg.filter(g => mast.has(g.id)).length, tot = totals[s.key] || 0;
    const shown = sg.filter(g => inTab(g) && (!q || norm(searchText(g)).includes(q)));
    if (!shown.length && (tab === 'mastered' || q)) continue;   // hide empty subjects on the mastered tab and while searching
    shownAny = true;
    h += `<details class="card subj" data-subj="${s.key}" ${ui.closed.has(s.key) && !q ? '' : 'open'}>
      <summary><span class="dot" style="--c:${sv(s.key)}"></span><h2>${esc(sName(s.key))}</h2><span class="bar" role="img" aria-label="${esc(t('bar_aria', sName(s.key), n, tot))}"><i style="width:${tot ? Math.round(100 * n / tot) : 0}%;background:${sv(s.key)}"></i></span><span class="b-num">${n}/${tot}</span>${touchNum(sName(s.key), touches[s.key] || 0)}</summary>
      <ul class="status-list">${shown.length ? shown.map(g => {
        const via = m.get(g.id), since = mast.get(g.id);
        return `<li class="${since ? 'done' : ''}${via ? '' : ' untouched'}"><span class="code" style="--c:${sv(g.subject)}">${esc(g.code || '—')}</span>
          <div class="g-body">${gCat(g) ? `<p class="g-meta">${esc(gCat(g))}</p>` : ''}<p class="g-desc">${esc(gDesc(g))}</p>${since && tab === 'mastered' ? `<p class="since">${esc(t('mastered_since', fmtDate(since)))}</p>` : ''}${via ? `<p class="via">${esc(t('via'))} ${via.map(a => `${esc(a.title)} (${esc(fmtDate(a.date))})`).join(', ')}</p>` : ''}</div>
          ${touchNum(g.code || sName(g.subject), via ? via.length : 0)}
          <label class="mastery"${since ? ` title="${esc(t('mastered_since', fmtDate(since)))}"` : ''}><input type="checkbox" id="m-${esc(g.id)}" data-mastery="${esc(g.id)}" ${since ? 'checked' : ''} ${canWrite ? '' : 'disabled'} aria-label="${esc(t('mastery_aria', g.code || gDesc(g).slice(0, 40)))}"><span aria-hidden="true">${bt('mastered_lbl')}</span></label></li>`;
      }).join('') : `<li><span></span><p class="muted">${esc(t('all_mastered'))}</p></li>`}</ul>
    </details>`;
  }
  if (!shownAny) h += `<p class="muted">${esc(q ? t('no_goals_found') : t('none_mastered'))}</p>`;
  if (acts.length) h += `<h2>${esc(t('child_acts', c.name))}</h2><div class="act-list">${acts.map(activityCard).join('')}</div>`;
  return h;
}

/* Tick or untick one goal as mastered for the open child; saved at once on the child's document. */
async function setMastery(gid, on) {
  const c = data.children.get(ui.childId); if (!c || !data.goals.has(gid)) return;
  if (!!c.mastered[gid] === on) return;
  const mastered = { ...c.mastered };
  if (on) mastered[gid] = todayIso(); else delete mastered[gid];
  try { await put('children', c.id, { ...bodyOf(c), mastered, updatedAt: Date.now() }); }
  catch (e) { toast(errMsg(e), true); }
  scheduleRender();
}

function goalChip(g) { return `<li class="code goal-chip" style="--c:${sv(g.subject)}" data-gid="${esc(g.id)}" tabindex="0" aria-label="${esc(`${g.code} ${sName(g.subject)}: ${gDesc(g)}`)}"><span class="dot"></span>${esc(g.code || sName(g.subject))}</li>`; }

/* Up to ten thumbnails (two rows of five) to hover and open, with the number of photos below.
   The viewer and the activity's edit form show all of them. */
function photoStrip(a) {
  const ids = a.photoIds, SHOW = 10;

  const thumbs = ids.slice(0, SHOW).map((id, i) => `<button type="button" class="thumb" data-action="photo" data-id="${esc(a.id)}" data-i="${i}" aria-label="${esc(t('photo_alt', a.title, i + 1))}">${photoImg(id)}</button>`);

function activityCard(a) {

      ${goals.length ? `<ul class="goal-chips" aria-label="${esc(t('goals_aria'))}">${goals.slice(0, maxChips).map(goalChip).join('')}${goals.length > maxChips ? `<li class="code">+${goals.length - maxChips}</li>` : ''}</ul>` : `<p class="meta">${esc(t('no_goals_linked'))}</p>`}

function viewActivities() {
  const kids = sortedChildren(), q = norm(ui.actSearch);
  if (ui.actChild && !data.children.has(ui.actChild)) ui.actChild = '';
  const acts = [...data.activities.values()].filter(a =>
    (!ui.actChild || a.childIds.includes(ui.actChild)) &&
    (!q || norm(a.title + ' ' + a.notes + ' ' + a.goalIds.map(id => data.goals.get(id)?.code || '').join(' ')).includes(q))
  ).sort(byDateDesc);

  h += `<section class="page-head"><div><h1>${esc(t('h_acts'))}</h1><p class="lede">${esc(t('acts_lede'))}</p></div>
    <div class="head-actions w"><button class="btn primary" data-action="new-activity" ${kids.length ? '' : 'disabled'}>${bt('add_activity')}</button></div></section>`;
  if (!data.activities.size) {
    return h + `<div class="empty"><h2>${esc(t('empty_acts_h'))}</h2><p>${esc(kids.length ? t('empty_acts_p') : t('empty_acts_nokids'))}</p>${kids.length ? `<button class="btn primary w" data-action="new-activity">${bt('add_activity')}</button>` : `<a class="btn" href="#overzicht">${bt('to_overview')}</a>`}</div>`;
  }
  h += `<div class="toolbar"><input class="search" id="act-search" type="search" placeholder="${esc(t('search_acts'))}" value="${esc(ui.actSearch)}" aria-label="${esc(t('search_acts'))}">
    <select class="select" id="act-child" aria-label="${esc(t('filter_child'))}"><option value="">${esc(t('all_children'))}</option><option hidden disabled>${esc(tIn(lang === 'nl' ? 'en' : 'nl', 'all_children'))}</option>${kids.map(k => `<option value="${esc(k.id)}" ${ui.actChild === k.id ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></div>`;

function viewGoals(cov) {

  }

    <div class="chips-filter" role="group" aria-label="${esc(t('filter_subject'))}">
      <button class="fchip" data-action="goal-filter-all" aria-pressed="${allOn}">${bt('all_subjects')}</button>
      ${SUBJECTS.map(s => `<button class="fchip" style="--c:${sv(s.key)}" data-action="goal-filter" data-key="${s.key}" aria-pressed="${ui.goalSubj.has(s.key)}"><span class="dot"></span>${bName(s.key)}</button>`).join('')}
    </div>
    <p class="count-line">${esc(t('count_line', list.length, all.length, kids.length))}</p>`;

  h += `<ul class="card goal-list">${list.slice(0, MAX).map(g => `<li class="goal-row">
      <span class="code" style="--c:${sv(g.subject)}"><span class="dot"></span>${esc(g.code || '—')}</span>

      <div class="g-side">${kids.length ? `<span class="kids-row">${kids.map(k => { const done = !!k.mastered[g.id]; return `<span class="avatar sm ${done ? '' : 'off'}" title="${esc(done ? t('kid_done', k.name) : t('kid_open', k.name))}">${animalArt(k.animal)}</span>`; }).join('')}</span>` : ''}
        ${g.builtin ? `<span class="tag" title="${esc(t('builtin_title'))}">${esc(t('builtin'))}</span>` : `<span class="row-actions w"><button class="icon-btn" data-action="edit-goal" data-id="${esc(g.id)}">${bt('edit')}</button><button class="icon-btn del" data-action="delete-goal" data-id="${esc(g.id)}">${bt('delete')}</button></span>`}</div>

  if (list.length > MAX) h += `<p class="count-line">${esc(t('first_n', MAX))}</p>`;

/* ---------- animal avatars ----------
   The drawings live in design/animals/ (one SVG per animal, listed in animals.json). tools/build.py
   adds them to the page as <symbol id="an-NAME"> elements and fills in this list of [emoji, name]
   pairs, in picker order. Children store the emoji as their animal; it only selects the drawing. */
const ANIMAL_LIST = [];
const ANIMALS = ANIMAL_LIST.map(a => a[0]);
const ANIMAL_ID = new Map(ANIMAL_LIST.map(([key, name]) => [key, 'an-' + name]));
/* Avatar contents for a stored animal: its drawing, or the stored text itself for anything unknown. */
const animalArt = a => ANIMAL_ID.has(a) ? `<svg viewBox="0 0 64 64" focusable="false"><use href="#${ANIMAL_ID.get(a)}"/></svg>` : esc(a);

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDialog(html, mount) {
  dlg.innerHTML = html;
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  mount && mount(dlg);
  const first = dlg.querySelector('[autofocus]'); if (first) first.focus();
}
function closeDialog() { if (dlg2.open) dlg2.close(); if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) closeDialog(); });
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
const dlg2 = $('#dlg2');
dlg2.addEventListener('click', e => { if (e.target === dlg2 || e.target.closest('[data-close]')) dlg2.close(); });
dlg2.addEventListener('close', () => { dlg2.innerHTML = ''; });

function shell(id, title, body, submitLabel = t('save'), extraClass = '') {
  return `<form class="dlg-form" id="${id}" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></header>
    <div class="dlg-body">${body}</div>
    <footer><p class="form-error" role="alert"></p><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button>${submitLabel ? `<button type="submit" class="btn ${extraClass || 'primary'}">${esc(submitLabel)}</button>` : ''}</footer>
  </form>`;
}
function bindSubmit(d, handler) {
  const form = d.querySelector('form'), err = d.querySelector('.form-error'), btn = form.querySelector('[type=submit]');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = t('busy');
    try {
      const msg = await handler(form, (txt) => { btn.textContent = txt; });
      if (typeof msg === 'string') { err.textContent = msg; return; }
      closeDialog();
    } catch (ex) { err.textContent = errMsg(ex); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
  });
}
function confirmDialog(title, bodyHtml, confirmLabel, onConfirm) {
  openDialog(shell('f-confirm', title, bodyHtml, confirmLabel, 'danger'), d => bindSubmit(d, async () => { await onConfirm(); }));
}

/* child */
function childDialog(child) {
  const used = new Set([...data.children.values()].filter(c => !child || c.id !== child.id).map(c => c.animal));
  const free = ANIMALS.filter(a => !used.has(a));
  const current = child ? child.animal : (free.length ? free[Math.floor(Math.random() * free.length)] : ANIMALS[0]);
  const body = `<label class="field"><span>${esc(t('name'))}</span><input id="c-name" name="name" maxlength="80" autocomplete="off" required autofocus value="${esc(child?.name || '')}"></label>
    <div class="field"><span class="field-label">${esc(t('animal'))}</span><div class="animal-grid" role="radiogroup" aria-label="${esc(t('animal'))}">
      ${ANIMALS.map((a, i) => `<label title="${used.has(a) ? esc(t('animal_taken')) : ''}"><input type="radio" name="animal" id="c-an-${i}" value="${esc(a)}" ${a === current ? 'checked' : ''} ${used.has(a) && free.length ? 'disabled' : ''}><span class="avatar" aria-hidden="true">${animalArt(a)}</span></label>`).join('')}
    </div></div>`;
  openDialog(shell('f-child', child ? t('child_edit_h') : t('child_add_h'), body), d => {
    bindSubmit(d, async form => {
      const name = form.name.value.trim();
      if (!name) return t('err_name');
      const dup = [...data.children.values()].some(c => (!child || c.id !== child.id) && c.name.localeCompare(name, 'nl', { sensitivity: 'accent' }) === 0);
      if (dup) return t('err_dup_name', name);
      const animal = form.querySelector('input[name=animal]:checked')?.value || current;
      const now = Date.now();
      await put('children', child?.id || newId(), { ...(child ? bodyOf(child) : { createdAt: now }), name, animal, updatedAt: now, example: false });
      toast(child ? t('saved_changes') : t('child_added', name));
    });
  });
}
function deleteChild(id) {
  const c = data.children.get(id); if (!c) return;
  const affected = [...data.activities.values()].filter(a => a.childIds.includes(id));

    d.querySelector('#a-pick')?.addEventListener('click', () => goalPicker(selGoals, chosenKids(), picked => {
      selGoals.clear(); for (const id of picked) selGoals.add(id); drawSel();
    }));
    drawSel();

    /* photos: new ones live in memory until the activity is saved */
    const photos = (act ? act.photoIds : []).map(id => ({ id, existing: true }));
    const pbox = d.querySelector('#a-photos'), pcount = d.querySelector('#a-pcount'), phint = d.querySelector('#a-phint');
    let processing = 0;
    function drawPhotos() {
      pcount.textContent = photos.length ? `· ${photos.length}` : '';
      pbox.innerHTML = photos.map((p, i) => `<span class="pe">${p.url ? `<img src="${esc(p.url)}" alt="">` : photoImg(p.id)}<button type="button" class="pe-x" data-pi="${i}" aria-label="${esc(t('photo_remove'))}">×</button></span>`).join('')
        + (photos.length < MAX_PHOTOS ? `<label class="photo-add">+ ${esc(t('add_photos'))}<input type="file" id="a-file" accept="image/*" multiple></label>` : '');

    }
    async function addFiles(list) {
      const files = [...list].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name));
      const room = MAX_PHOTOS - photos.length;
      if (files.length > room) toast(t('photo_max', MAX_PHOTOS), true);
      let failed = 0;
      processing++; phint.textContent = t('photo_processing');
      for (const f of files.slice(0, Math.max(0, room))) {
        try { const rec = await processImage(f); if (!dlg.contains(pbox)) return; photos.push({ id: newId(), rec, url: b64ToUrl(rec), existing: false }); drawPhotos(); }
        catch (e) { failed++; }
      }
      processing--; if (!processing) phint.textContent = t('photo_hint');
      if (failed) toast(t('photo_fail', failed), true);

    pbox.addEventListener('change', e => { if (e.target.id === 'a-file' && e.target.files.length) addFiles(e.target.files); });
    pbox.addEventListener('click', e => {
      const x = e.target.closest('[data-pi]'); if (!x) return;
      const [p] = photos.splice(Number(x.dataset.pi), 1);
      if (p && !p.existing && p.url) URL.revokeObjectURL(p.url);
      drawPhotos();
    });
    const dz = d.querySelector('.dlg-body');
    dz.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dz.classList.add('drop'); } });
    dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drop'); });
    dz.addEventListener('drop', e => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); dz.classList.remove('drop'); addFiles(e.dataTransfer.files); });
    d.querySelector('form').addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/')); if (fs.length) { e.preventDefault(); addFiles(fs); } });
    drawPhotos();

    bindSubmit(d, async form => {
      const title = form.title.value.trim(), date = form.date.value, childIds = chosenKids();
      if (!title) return t('err_title');
      if (!validDate(date)) return t('err_date');
      if (!childIds.length) return t('err_kids');
      if (processing) return t('photo_wait');
      const now = Date.now();
      const firstOwn = !act && ![...data.activities.values()].some(a => !a.example);
      const fresh = photos.filter(p => !p.existing);
      const errors = await runPool(fresh, p => photoStore.put(p.id, { ...p.rec, createdAt: now }), 3);
      if (errors.length) throw errors[0];
      for (const p of fresh) { photoUrl.set(p.id, p.url); p.existing = true; }
      await put('activities', act?.id || newId(), { ...(act ? bodyOf(act) : { createdAt: now }), title, date, notes: form.notes.value, childIds, goalIds: [...selGoals], photoIds: photos.map(p => p.id), updatedAt: now, example: false });
      const removed = (act ? act.photoIds : []).filter(id => !photos.some(p => p.id === id));
      await runPool(removed, deletePhoto, 3);
      if (fresh.length && mode === 'local') navigator.storage?.persist?.().catch(() => {});
      toast(act ? t('act_updated') : t('act_saved'));
      if (firstOwn) scheduleThanks();
    });
  });
}

/* Goal picker: its own window on top of the activity form. Works on a copy of the
   selection, so Cancel (or Esc) leaves the activity untouched. */
function goalPicker(initial, kidIds, onDone) {
  const sel = new Set(initial), cov = buildCoverage(), goals = sortedGoals();
  dlg2.innerHTML = `<form class="dlg-form picker-dlg" novalidate>
    <header><h2>${esc(t('pick_h'))}</h2><button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></header>

      <select class="select" id="p-subj" aria-label="${esc(t('subject'))}"><option value="">${esc(t('all_subjects'))}</option>${SUBJECTS.filter(s => goals.some(g => g.subject === s.key)).map(s => `<option value="${s.key}">${esc(sName(s.key))}</option>`).join('')}</select>
      <select class="select" id="p-show" aria-label="${esc(t('show'))}"><option value="all">${esc(t('show_all'))}</option>${kidIds.length ? `<option value="open">${esc(t('show_open'))}</option>` : ''}<option value="sel">${esc(t('show_sel'))}</option></select>
    </div>
    <div class="picker-scroll" id="p-list"></div>
    <footer><p class="pick-count" id="p-count" aria-live="polite"></p><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button><button type="submit" class="btn primary">${esc(t('done'))}</button></footer>
  </form>`;
  const list = dlg2.querySelector('#p-list'), q = dlg2.querySelector('#p-q'), subj = dlg2.querySelector('#p-subj'), show = dlg2.querySelector('#p-show'), count = dlg2.querySelector('#p-count');
  const drawCount = () => { count.textContent = t('n_selected', sel.size); };
  function drawList() {
    const qq = norm(q.value), sk = subj.value, m2 = show.value;
    const items = goals.filter(g =>
      (!sk || g.subject === sk) &&
      (!qq || norm(searchText(g)).includes(qq)) &&
      (m2 !== 'sel' || sel.has(g.id)) &&
      (m2 !== 'open' || kidIds.some(cid => !cov.get(cid)?.has(g.id))));
    const MAX = 300;
    let html = '', group = '';
    for (const g of items.slice(0, MAX)) {
      if (g.subject !== group) { group = g.subject; html += `<div class="pick-group"><span class="dot" style="--c:${sv(g.subject)}"></span>${esc(sName(g.subject))}</div>`; }
      html += `<label class="pick"><input type="checkbox" value="${esc(g.id)}" ${sel.has(g.id) ? 'checked' : ''}><span class="code" style="--c:${sv(g.subject)}">${esc(g.code || '—')}</span><span class="g-desc">${gCat(g) ? `<span class="g-meta">${esc(gCat(g))}</span>\n` : ''}${esc(gDesc(g))}</span></label>`;
    }
    if (items.length > MAX) html += `<p class="pick-more">${esc(t('n_more', items.length - MAX))}</p>`;
    if (!items.length) html += `<p class="pick-more">${esc(t('picker_none'))}</p>`;
    list.innerHTML = html;
  }
  list.addEventListener('change', e => { const el = e.target; if (el.type !== 'checkbox') return; el.checked ? sel.add(el.value) : sel.delete(el.value); drawCount(); });
  q.addEventListener('input', drawList); subj.addEventListener('change', drawList); show.addEventListener('change', drawList);
  dlg2.querySelector('form').addEventListener('submit', e => { e.preventDefault(); onDone(sel); dlg2.close(); });
  drawCount(); drawList();
  if (typeof dlg2.showModal === 'function') dlg2.showModal(); else dlg2.setAttribute('open', '');
  q.focus();
}

/* ---------- photo preview on hover, lightbox on click ---------- */
const peek = $('#peek'), peekImg = peek.querySelector('img');
let peekFor = null;
function showPeek(th) {
  const img = th.querySelector('img');
  if (!img || !img.complete || !img.naturalWidth) return;
  peekFor = th;
  const vw = window.innerWidth, vh = window.innerHeight, r = th.getBoundingClientRect();
  const s = Math.min(Math.min(440, vw - 32) / img.naturalWidth, Math.min(440, vh - 32) / img.naturalHeight);
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  let left = r.right + 12;
  if (left + w > vw - 16) left = r.left - 12 - w;
  if (left < 16) left = Math.max(16, (vw - w) / 2);
  const top = Math.min(Math.max(16, r.top + r.height / 2 - h / 2), vh - 16 - h);
  peekImg.src = img.src;
  Object.assign(peek.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
  peek.hidden = false;
  requestAnimationFrame(() => { if (peekFor === th) peek.classList.add('show'); });
}
function hidePeek() { peekFor = null; peek.classList.remove('show'); peek.hidden = true; hideGoalPeek(); }

/* Goal preview: below the code when it fits, otherwise above; kept inside the window. */

  gpeek.classList.remove('show');
  gpeek.hidden = false;
  const vw = window.innerWidth, vh = window.innerHeight, r = chip.getBoundingClientRect(), b = gpeek.getBoundingClientRect();
  let top = r.bottom + 8;
  if (top + b.height > vh - 16) top = Math.max(16, r.top - 8 - b.height);
  const left = Math.min(Math.max(16, r.left), vw - 16 - b.width);
  Object.assign(gpeek.style, { left: left + 'px', top: top + 'px' });
  requestAnimationFrame(() => { if (gpeekFor === chip) gpeek.classList.add('show'); });

const lb = $('#lightbox'), lbImg = $('#lb-img'), lbCap = $('#lb-cap');
let lbState = null;
function openLightbox(actId, i) {
  const a = data.activities.get(actId);
  if (!a || !a.photoIds.length) return;
  hidePeek();
  lbState = { id: actId, i: Math.min(i, a.photoIds.length - 1) };

}
function drawLightbox() {
  const a = lbState && data.activities.get(lbState.id);
  if (!a || !a.photoIds.length) { if (lb.open) lb.close(); return; }
  const n = a.photoIds.length, i = lbState.i = ((lbState.i % n) + n) % n, id = a.photoIds[i];
  lbImg.removeAttribute('src');
  lbImg.alt = t('photo_alt', a.title, i + 1);
  lbCap.textContent = `${a.title} · ${fmtDate(a.date)} · ${i + 1}/${n}`;
  for (const b of lb.querySelectorAll('.lb-btn')) b.hidden = n < 2;
  loadPhoto(id).then(u => { if (u && lbState && lbState.id === a.id && lbState.i === i) lbImg.src = u; });
}
lb.addEventListener('click', e => {
  const b = e.target.closest('[data-lb]');
  if (e.target === lb || (b && b.dataset.lb === 'close')) { lb.close(); return; }
  if (b && lbState) { lbState.i += b.dataset.lb === 'next' ? 1 : -1; drawLightbox(); }
});

  if (!lbState) return;
  if (e.key === 'ArrowRight') { lbState.i++; drawLightbox(); }
  if (e.key === 'ArrowLeft') { lbState.i--; drawLightbox(); }
});
lb.addEventListener('close', () => { lbState = null; lbImg.removeAttribute('src'); });

/* ---------- toast ---------- */
let toastT;
function toast(msg, bad) {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => { el.className = 'toast'; }, bad ? 6500 : 2800);
}

/* ---------- events ---------- */
const main = $('#main');
main.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  const id = b.dataset.id, act = b.dataset.action;

    case 'add-child': return childDialog(null);
    case 'edit-child': return childDialog(data.children.get(id));

    case 'open-child': ui.view = 'kind'; ui.childId = id; ui.kidTab = 'all'; ui.kidSearch = ''; render(); window.scrollTo(0, 0); return;
    case 'back': ui.view = 'overzicht'; render(); return;
    case 'kid-tab': ui.kidTab = b.dataset.tab; return render();
    case 'new-activity': return activityDialog(null, b.dataset.child);
    case 'edit-activity': return activityDialog(data.activities.get(id));
    case 'delete-activity': return deleteActivity(id);
    case 'new-goal': return goalDialog(null);
    case 'edit-goal': return goalDialog(data.goals.get(id));

});
/* Hover previews for photo thumbnails and goal codes; any mouse move off the element closes them. */
main.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse') return;
  const th = e.target.closest('.thumb'); if (th && th !== peekFor) showPeek(th);
  const gc = e.target.closest('.goal-chip'); if (gc && gc !== gpeekFor) showGoalPeek(gc);
});
main.addEventListener('pointerout', e => {
  const th = e.target.closest('.thumb'); if (th && !th.contains(e.relatedTarget)) hidePeek();
  const gc = e.target.closest('.goal-chip'); if (gc && !gc.contains(e.relatedTarget)) hideGoalPeek();
});
main.addEventListener('focusin', e => {
  const th = e.target.closest('.thumb'); if (th && th.matches(':focus-visible')) showPeek(th);
  const gc = e.target.closest('.goal-chip'); if (gc) showGoalPeek(gc);
});
main.addEventListener('focusout', e => { if (e.target.closest('.thumb, .goal-chip')) hidePeek(); });
main.addEventListener('submit', e => { if (e.target.id === 'auth-form') { e.preventDefault(); submitAuth(e.target); } });
main.addEventListener('input', e => {
  if (e.target.id === 'au-email') ui_auth.email = e.target.value;
  if (e.target.id === 'goal-search') { ui.goalSearch = e.target.value; scheduleRender(); }
  if (e.target.id === 'act-search') { ui.actSearch = e.target.value; scheduleRender(); }
  if (e.target.id === 'kid-search') { ui.kidSearch = e.target.value; scheduleRender(); }
});
main.addEventListener('change', e => {
  if (e.target.id === 'act-child') { ui.actChild = e.target.value; render(); }
  if (e.target.dataset.mastery) setMastery(e.target.dataset.mastery, e.target.checked);
});
main.addEventListener('toggle', e => {
  const el = e.target; if (!el.matches || !el.matches('details[data-subj]')) return;
  el.open ? ui.closed.delete(el.dataset.subj) : ui.closed.add(el.dataset.subj);
}, true);
$('#data-btn').addEventListener('click', dataDialog);
$('#theme-btn').addEventListener('click', () => {
  const next = themeNow() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
  renderTheme();
});
$('#lang-switch').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
  closeDialog();
  render();
});
function fromHash() {
  const h = location.hash.replace('#', '');
  if (['overzicht', 'activiteiten', 'doelen'].includes(h)) ui.view = h;
  else if (!h) ui.view = 'overzicht';
  render();
}
window.addEventListener('hashchange', fromHash);
$('.tabs').addEventListener('click', e => {
  const a = e.target.closest('[data-tab]');
  if (a && location.hash === '#' + a.dataset.tab) { e.preventDefault(); ui.view = a.dataset.tab; render(); }
});

/* ---------- Firebase accounts ----------
   Each account's data lives under users/{uid}/{children|activities|goals|photos}/{id}; the
   Firestore rules only let that account read or write it. firestoreStore() exposes the same small
   interface as the Claude-hosted store, so the rest of the app runs unchanged in mode 'db'. */
let fb = null, fbUser = null, unsubs = [];
const ui_auth = { view: 'login', email: '', msg: '', err: '' };

async function startFirebase() {
  try {
    const [appM, authM, fsM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
    const cfg = { ...FIREBASE_CONFIG }, emu = cfg.emulator; delete cfg.emulator;
    const app = appM.initializeApp(cfg);
    const auth = authM.getAuth(app);
    let fs;
    try { fs = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch (e) { fs = fsM.getFirestore(app); }
    if (emu) { authM.connectAuthEmulator(auth, emu.auth, { disableWarnings: true }); fsM.connectFirestoreEmulator(fs, emu.host, emu.port); }
    fb = { auth, fs, A: authM, F: fsM };
    authM.onAuthStateChanged(auth, user => { if (user) enterAccount(user); else leaveAccount(); });
  } catch (e) {
    mode = 'auth'; ui_auth.err = t('sdk_fail'); render();
  }
}
function fbErr(e) {
  const map = { 'permission-denied': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unauthenticated': 'revoked', 'invalid-argument': 'invalid_argument' };
  const err = new Error(e && e.message); err.code = map[e && e.code] || 'unavailable'; err.fbCode = e && e.code;
  return err;
}
function firestoreStore(uid) {
  const { F, fs } = fb;
  const col = c => F.collection(fs, 'users', uid, c);
  const ref = (c, id) => F.doc(fs, 'users', uid, c, id);
  const snap = d => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  /* Writes apply locally at once and sync in the background; offline they would never resolve,
     so stop waiting after a moment and report a later rejection as a toast. */
  const settle = p => new Promise((resolve, reject) => {
    let waiting = true;
    const timer = setTimeout(() => { waiting = false; resolve(); }, 2500);
    p.then(() => { if (waiting) { clearTimeout(timer); resolve(); } },
      e => { if (waiting) { clearTimeout(timer); reject(fbErr(e)); } else toast(t('late_write_fail'), true); });
  });
  const docApi = (c, id) => ({
    set: d => settle(F.setDoc(ref(c, id), d)),
    delete: () => settle(F.deleteDoc(ref(c, id))),
    get: () => F.getDoc(ref(c, id)).then(snap, e => { throw fbErr(e); }),
  });
  return {
    collection: c => ({
      doc: id => docApi(c, id),
      onSnapshot: (next, error) => F.onSnapshot(col(c), s => next({ docs: s.docs.map(snap) }), e => error && error(fbErr(e))),
    }),
    doc: path => { const [c, id] = path.split('/'); return docApi(c, id); },
  };
}
function resetData() {
  setGoals(new Map()); data.children = new Map(); data.activities = new Map();
  for (const c of COLS) loaded[c] = false;
}
function subscribeAll() {
  for (const u of unsubs) u();
  unsubs = COLS.map(c => db.collection(c).onSnapshot(s => {
    const m = new Map();
    for (const doc of s.docs) { if (!doc.exists) continue; const b = clean(c, doc.data()); if (b) m.set(doc.id, { ...b, id: doc.id }); }
    if (c === 'goals') setGoals(m); else data[c] = m;
    loaded[c] = true; scheduleRender();
  }, err => {
    loaded[c] = true; scheduleRender();
    toast(err && err.code === 'revoked' ? t('err_revoked') : t('err_conn'), true);
  }));
}
function enterAccount(user) {
  if (fbUser && fbUser.uid === user.uid) return;
  fbUser = user; db = firestoreStore(user.uid);
  mode = 'db'; canWrite = true; canWriteKnown = true;
  resetData(); closeDialog(); render(); subscribeAll();
  readLocalSummary();
}
function leaveAccount() {
  for (const u of unsubs) u();
  unsubs = []; fbUser = null; db = null;
  resetData(); closeDialog();
  mode = 'auth'; render();
}

/* login / sign-up / reset screen */
function authView() {
  const v = ui_auth.view;
  const head = { login: ['auth_h', 'auth_p'], signup: ['signup_h', 'signup_p'], reset: ['reset_h', 'reset_p'] }[v];
  const pw = v === 'reset' ? '' : `<label class="field"><span>${esc(t('password'))}</span><input id="au-pw" name="password" type="password" autocomplete="${v === 'signup' ? 'new-password' : 'current-password'}" required></label>`;
  const pw2 = v === 'signup' ? `<label class="field"><span>${esc(t('password2'))}</span><input id="au-pw2" name="password2" type="password" autocomplete="new-password" required><span class="hint">${esc(t('pw_hint'))}</span></label>` : '';
  const submit = { login: 'login', signup: 'signup', reset: 'reset_btn' }[v];
  const links = v === 'login'
    ? `<button type="button" class="linkish" data-action="auth-view" data-v="signup">${bt('to_signup')}</button><button type="button" class="linkish" data-action="auth-view" data-v="reset">${bt('forgot')}</button>`
    : `<button type="button" class="linkish" data-action="auth-view" data-v="login">${bt(v === 'signup' ? 'to_login' : 'back_login')}</button>`;
  return `<section class="card auth">
    <div><h1>${esc(t(head[0]))}</h1>${v === 'reset' ? '' : `<p class="about">${esc(t('about_p'))}</p>`}<p class="lede">${esc(t(head[1]))}</p></div>
    <form id="auth-form" novalidate>
      <label class="field"><span>${esc(t('email'))}</span><input id="au-email" name="email" type="email" autocomplete="email" inputmode="email" required value="${esc(ui_auth.email)}"></label>
      ${pw}${pw2}
      <p class="form-error" id="au-err" role="alert">${esc(ui_auth.err)}</p>
      ${ui_auth.msg ? `<p class="info" role="status">${esc(ui_auth.msg)}</p>` : ''}
      <button class="btn primary" type="submit" ${fb ? '' : 'disabled'}>${bt(submit)}</button>
    </form>
    <div class="auth-links">${links}</div>
    <p class="privacy">${esc(t('privacy'))}</p>
  </section>`;
}
function authErr(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|missing-password/.test(c)) return t('ae_invalid');
  if (c.includes('email-already-in-use')) return t('ae_inuse');
  if (/invalid-email|missing-email/.test(c)) return t('ae_email');
  if (c.includes('weak-password')) return t('ae_weak');
  if (c.includes('too-many-requests')) return t('ae_many');
  if (c.includes('network-request-failed')) return t('ae_net');
  return t('ae_generic');
}
async function submitAuth(form) {
  if (!fb) return;
  const { A, auth } = fb, v = ui_auth.view;
  const email = form.email.value.trim(), err = form.querySelector('#au-err'), btn = form.querySelector('[type=submit]');
  ui_auth.email = email; ui_auth.err = ''; ui_auth.msg = '';
  err.textContent = '';
  form.querySelector('.info')?.remove();
  if (!email) { err.textContent = t('err_email_empty'); return; }
  if (v === 'signup') {
    if (form.password.value.length < 8) { err.textContent = t('err_pw_short'); return; }
    if (form.password.value !== form.password2.value) { err.textContent = t('err_pw_match'); return; }
  }
  const label = btn.textContent; btn.disabled = true; btn.textContent = t('busy');
  try {
    if (v === 'login') await A.signInWithEmailAndPassword(auth, email, form.password.value);
    else if (v === 'signup') await A.createUserWithEmailAndPassword(auth, email, form.password.value);
    else {
      auth.languageCode = lang;
      await A.sendPasswordResetEmail(auth, email);
      ui_auth.msg = t('reset_sent'); render();
    }
  } catch (e) {
    if (btn.isConnected) { err.textContent = authErr(e); btn.disabled = false; btn.textContent = label; }
    return;
  }
  if (btn.isConnected) { btn.disabled = false; btn.textContent = label; }
}
/* Signing out also wipes this browser's offline copy of the account, so the next person on a
   shared computer finds nothing. */
async function logout() {
  if (!fb) return;
  try { await fb.A.signOut(fb.auth); } catch (e) {}
  try { await fb.F.terminate(fb.fs); await fb.F.clearIndexedDbPersistence(fb.fs); } catch (e) { console.warn('doelenboek: could not clear offline copy', e && e.code, e && e.message); }
  location.reload();
}
function deleteAccountDialog() {
  const body = `<p>${esc(t('del_acc_p'))}</p><label class="field"><span>${esc(t('del_acc_confirm'))}</span><input id="da-pw" name="password" type="password" autocomplete="current-password" autofocus></label>`;
  openDialog(shell('f-delacc', t('del_acc'), body, t('del_acc_btn'), 'danger'), d => bindSubmit(d, async form => {
    const { A, F, auth, fs } = fb, user = auth.currentUser;
    if (!user) return t('ae_generic');
    try { await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, form.password.value)); }
    catch (e) { return authErr(e); }
    for (const c of [...COLS, 'photos']) {
      const s = await F.getDocs(F.collection(fs, 'users', user.uid, c));
      const errors = await runPool(s.docs, docSnap => F.deleteDoc(docSnap.ref), 6);
      if (errors.length) throw fbErr(errors[0]);
    }
    try { await A.deleteUser(user); } catch (e) { return authErr(e); }
    try { localStorage.removeItem(MIGRATED_KEY + user.uid); } catch (e) {}
    try { await F.terminate(fs); await F.clearIndexedDbPersistence(fs); } catch (e) {}
    toast(t('del_done'));
    setTimeout(() => location.reload(), 600);
  }));
}

/* One-time offer to move data saved in this browser (before accounts existed) into the account. */
let localSummary = null;
function readLocalSummary() {
  localSummary = null;
  try {
    const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!o) return;
    const n = c => Object.keys(o[c] || {}).length;
    if (n('children') + n('activities') + n('goals')) localSummary = { o, children: n('children'), activities: n('activities') };
  } catch (e) {}
}
function migrationNotice() {
  if (!fbUser || !localSummary) return '';
  try { if (localStorage.getItem(MIGRATED_KEY + fbUser.uid)) return ''; } catch (e) { return ''; }
  if (data.children.size || data.activities.size || customGoals.size) return '';
  return `<div class="notice"><p>${esc(t('mig_p', localSummary.children, localSummary.activities))}</p><span class="head-actions"><button class="btn small" data-action="migrate">${bt('mig_btn')}</button><button class="btn small" data-action="migrate-skip">${bt('mig_skip')}</button></span></div>`;
}
function markMigrated() { try { localStorage.setItem(MIGRATED_KEY + fbUser.uid, todayIso()); } catch (e) {} scheduleRender(); }
async function migrateLocal(btn) {
  const o = localSummary && localSummary.o; if (!o || !fbUser) return;
  btn.disabled = true;
  const docs = [];
  for (const c of COLS) for (const [id, v] of Object.entries(o[c] || {})) { if (!ID_RE.test(id) || (c === 'goals' && BUILTIN.has(id))) continue; const b = clean(c, v); if (b) docs.push({ c, id, b }); }
  const used = new Set(docs.filter(x => x.c === 'activities').flatMap(x => x.b.photoIds));
  let photos = [];
  try { photos = used.size ? (await localPhotosAll()).filter(p => used.has(p.id)) : []; } catch (e) {}
  const total = docs.length + photos.length;
  let n = 0;
  const step = () => { btn.textContent = t('progress', ++n, total); };
  const errors = await runPool(photos, async p => { await photoStore.put(p.id, p.rec); step(); }, 3);
  errors.push(...await runPool(docs, async x => { await put(x.c, x.id, x.b); step(); }, 4));
  if (errors.length) { toast(t('r_partial', errors.length, total, errMsg(errors[0])), true); btn.disabled = false; btn.textContent = t('mig_btn'); return; }
  markMigrated();
  toast(t('mig_done', total));
}

/* ---------- start ---------- */
function startLocal() {
  mode = 'local'; loadLocal(); render();
}
async function init() {
  fromHash();
  if (FIREBASE_CONFIG) { render(); startFirebase(); return; }
  if (!window.claude || typeof window.claude.use !== 'function') { startLocal(); return; }
  let d = null, u = null;
  try { [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }
  catch (e) { d = null; }
  if (!d) { startLocal(); toast(t('err_no_shared'), true); return; }
  db = d; mode = 'db';
  if (u) { try { const c = await u.can('data.write'); if (c === true || c === false) { canWrite = c; canWriteKnown = true; } } catch (e) {} }
  render();
  subscribeAll();
}
init();
})();
</script>
