<title>Doelenboek.be</title>
<!-- tools/build.py inlines these stylesheets; everything visual lives in design/ -->
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/app.css">
<link rel="stylesheet" href="core.css">
<!-- bright unless dark was chosen last time; applied before the page is drawn (chosen under Instellingen) -->
<script>let t = 'light'; try { if (localStorage.getItem('doelenboek.theme') === 'dark') t = 'dark'; } catch (e) {} document.documentElement.dataset.theme = t;</script>

<header class="top">
  <div class="top-inner">
    <div class="brand brand-row"><span class="brand-logo" aria-hidden="true"></span><b>Doelenboek.be</b></div>
    <nav class="tabs" aria-label="Doelenboek">
      <a href="#overzicht" data-tab="overzicht">Kinderen</a>
      <a href="#activiteiten" data-tab="activiteiten">Activiteiten</a>
      <a href="#doelen" data-tab="doelen">Doelen</a>
      <a href="#dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#reporting" data-tab="reporting">Rapportering</a>
    </nav>
    <div class="top-right">
      <span class="status" id="status">Verbinden…</span>
      <a class="btn small ghost" id="admin-link" href="admin/" hidden>Admin</a>
      <button class="btn small ghost" id="data-btn" type="button">Instellingen</button>
    </div>
  </div>
</header>
<main id="main"><p class="loading">Gegevens laden…</p></main>
<footer class="site-foot" id="site-foot">
  <p id="foot-cookies"></p>
  <p id="foot-goals"></p>
  <p class="contact"><span id="contact-text"></span> <a id="contact-link"></a></p>
  <p class="support"><span id="support-text"></span> <a id="support-link" href="https://ko-fi.com/mat644" target="_blank" rel="noopener"></a></p>
  <p class="privacy-foot"><button type="button" class="link-btn" id="privacy-link"></button></p>
</footer>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<dialog id="thanks" class="thanks" aria-labelledby="thanks-h"></dialog>
<dialog id="msgdlg" class="msg" aria-labelledby="msg-h"></dialog>
<dialog id="privacy" class="privacy" aria-labelledby="privacy-h"></dialog>
<dialog id="lightbox" class="lightbox">

  <button type="button" class="lb-btn lb-prev" data-lb="prev">‹</button>
  <button type="button" class="lb-btn lb-next" data-lb="next">›</button>

</dialog>
<div class="peek" id="peek" hidden><img alt=""></div>

  const rows = shown.map(s => ({ s, tot: subjectTotals(tierOf(s.kid)), n: countBySubject(inTier(masteredOf(s.kid), tierOf(s.kid))) }));
  const cols = SUBJECTS.filter(x => rows.some(r => r.tot[x.key]));
  const cells = rows.map(r => `<span class="mx-k">${dashKidLbl(r.s)}</span>` + cols.map(x => {
    const tot = r.tot[x.key], n = r.n[x.key] || 0;
    if (!tot) return `<span class="mx-c na" title="${esc(t('mx_na'))}">—</span>`;
    const p = Math.round(100 * n / tot);
    return `<span class="mx-c${p > 55 ? ' dark' : ''}" style="--p:${p}%" title="${esc(t('mx_tip', r.s.name, sName(x.key, tierOf(r.s.kid)), n, tot))}">${p}%</span>`;
  }).join('')).join('');
  return dashCard('mx_h', 'mx_note', `<div class="mx-wrap"><div class="mx" style="--cols:${cols.length}"><span></span>${cols.map(x => `<span class="mx-h" title="${esc(sName(x.key))}"><span class="dot" style="--c:${sv(x.key)}"></span>${esc(x.key === 'IC' ? 'ICT' : x.key)}</span>`).join('')}${cells}</div></div>
    <div class="mx-legend" aria-hidden="true"><span>0%</span><i></i><span>100%</span></div>`);
}
/* 2. per child the four subjects (of their level) whose last activity is longest ago, or that never came up */
function dashNeglected(shown) {
  const cov = buildCoverage();
  const rows = shown.map(s => {
    const tier = tierOf(s.kid), last = {};
    for (const [gid, acts] of inTier(cov.get(s.kid.id) || new Map(), tier)) {
      const k = data.goals.get(gid).subject, d = acts[acts.length - 1].date;
      if (!last[k] || d > last[k]) last[k] = d;
    }
    const subs = Object.keys(subjectTotals(tier)).map(k => ({ k, d: last[k] || null, n: last[k] ? daysAgo(last[k]) : Infinity }))
      .sort((a, b) => b.n - a.n || SUBJ[a.k].i - SUBJ[b.k].i).slice(0, 4);
    return `<li><span class="ng-k">${dashKidLbl(s)}</span><span class="ng-list">${subs.map(x => `<span class="ng-chip${x.n > 60 ? ' late' : ''}" title="${esc(x.d ? t('ng_tip', fmtDate(x.d)) : t('ng_tip_never'))}"><span class="dot" style="--c:${sv(x.k)}"></span>${esc(sName(x.k, tier))}<b>${esc(x.d ? t('ng_days', x.n) : t('ng_never'))}</b></span>`).join('')}</span></li>`;
  }).join('');
  return dashCard('ng_h', 'ng_note', `<ul class="ng">${rows}</ul>`);
}
/* 3. open goals (of the child's level) that at least two of the child's activities tagged: most tagged first */
const AM_SHOW = 8;
function dashAlmost(shown) {
  const cov = buildCoverage(), rows = [];
  for (const s of shown) {
    const tier = tierOf(s.kid), mast = s.kid.mastered || {};
    for (const [gid, acts] of inTier(cov.get(s.kid.id) || new Map(), tier))
      if (acts.length >= 2 && !mast[gid]) rows.push({ s, g: data.goals.get(gid), n: acts.length, last: acts[acts.length - 1].date });
  }
  rows.sort((a, b) => b.n - a.n || b.last.localeCompare(a.last));
  const list = ui.amAll ? rows : rows.slice(0, AM_SHOW);
  const body = rows.length ? `<ul class="am">${list.map(r => `<li><span class="code" style="--c:${sv(r.g.subject)}"><span class="dot"></span>${esc(gCode(r.g) || sName(r.g.subject, r.g.tier))}</span>
      <span class="am-d" title="${esc(gDesc(r.g))}">${esc(gDesc(r.g))}</span><span class="am-k">${dashKidLbl(r.s)}</span><span class="am-n">${esc(t('am_n', r.n))}</span>
      <button class="btn small ghost w" type="button" data-action="am-master" data-id="${esc(r.g.id)}" data-child="${esc(r.s.kid.id)}">${esc(t('am_btn'))}</button></li>`).join('')}</ul>
    ${rows.length > AM_SHOW ? `<button class="btn small ghost am-more" type="button" data-action="am-all">${esc(ui.amAll ? t('am_less') : t('am_more', rows.length))}</button>` : ''}`
    : `<p class="muted">${esc(t('am_none'))}</p>`;
  return dashCard('am_h', 'am_note', body);
}
/* 4. every day of the last 53 weeks (Monday on top), darker with more activities; a day clicked shows its
   activities underneath, the first added on top, each with a button to it on the activities tab */
function dashCalendar() {
  const acts = [...data.activities.values()], per = {};
  for (const a of acts) per[a.date] = (per[a.date] || 0) + 1;
  const today = dateObj(todayIso()), WEEKS = 53;
  const start = new Date(today); start.setDate(start.getDate() - (today.getDay() + 6) % 7 - (WEEKS - 1) * 7);
  const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const mFmt = new Intl.DateTimeFormat(t('locale'), { month: 'short' }), wFmt = new Intl.DateTimeFormat(t('locale'), { weekday: 'short' });
  let cells = '', months = '', lastM = -1, total = 0, gap = 0, run = 0;
  for (let w = 0; w < WEEKS; w++) for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(d.getDate() + w * 7 + i);
    if (i === 0 && d.getMonth() !== lastM) { if (w < WEEKS - 2) months += `<span style="grid-column:${w + 1}">${esc(cap1(mFmt.format(d).replace('.', '')))}</span>`; lastM = d.getMonth(); }
    if (d > today) continue;
    const iso = isoOf(d), n = per[iso] || 0;
    total += n; run = n ? 0 : run + 1; gap = Math.max(gap, run);
    cells += `<button type="button" class="cal-d l${Math.min(n, 4)}${iso === ui.calDay ? ' on' : ''}${iso === todayIso() ? ' today' : ''}" style="grid-column:${w + 1};grid-row:${i + 1}" data-action="cal-day" data-id="${iso}" title="${esc(t('cal_tip', fmtDate(iso), n))}" aria-label="${esc(t('cal_tip', fmtDate(iso), n))}"></button>`;
  }
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return i % 2 ? '<span></span>' : `<span>${esc(wFmt.format(d).replace('.', ''))}</span>`; }).join('');
  let panel = `<p class="cal-pick muted">${esc(t('cal_pick'))}</p>`;
  if (ui.calDay) {
    const day = acts.filter(a => a.date === ui.calDay).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    const go = a => `<p class="cal-go"><button class="btn small" type="button" data-action="go-activity" data-id="${esc(a.id)}">${esc(t('cal_go'))} →</button></p>`;
    panel = `<div class="cal-panel"><div class="cal-ph"><h3>${esc(cap1(new Intl.DateTimeFormat(t('locale'), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(dateObj(ui.calDay))))}</h3>
      <button class="btn small ghost" type="button" data-action="cal-close" aria-label="${esc(t('cal_close'))}">${esc(t('cal_close'))} ▴</button></div>
      ${day.length ? `<div class="act-list">${day.map(a => activityCard(a, go(a))).join('')}</div>` : `<p class="muted">${esc(t('cal_none'))}</p>`}</div>`;
  }
  return dashCard('cal_h', 'cal_note', `<div class="cal-wrap"><div class="cal-m" aria-hidden="true">${months}</div><div class="cal-days" aria-hidden="true">${days}</div><div class="cal">${cells}</div></div>
    <div class="cal-foot"><span>${esc(t('cal_sum', total, gap))}</span><span class="cal-leg" aria-hidden="true">${esc(t('cal_less'))} <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> ${esc(t('cal_more'))}</span></div>
    ${panel}`);
}
/* One graph: a line per series through one point per month, the months named under it, and the crosshair's data.
   Both dashboard graphs use it, each with its own months and smooth/straight choice; a series with fill
   gets the area under its line shaded. */
function dashPlot(shown, labels, aria, emptyMsg, straight, rel) {
  // rel: values are percentages on a fixed 0-100% scale
  const N = labels.length, top = rel ? 100 : niceTop(Math.max(0, ...shown.flatMap(s => s.vals))), unit = rel ? '%' : '';
  const xs = labels.map((_, i) => N > 1 ? 100 * i / (N - 1) : 50);
  const yOf = v => 100 - 100 * v / top;
  const step = Math.ceil(N / 6);   // at most about seven month names under the axis
  const lines = shown.map(s => { const ys = s.vals.map(yOf), d = straight ? 'M' + xs.map((x, i) => `${x.toFixed(2)},${ys[i].toFixed(2)}`).join(' L') : smoothPath(xs, ys); return `${s.fill ? `<path class="dc-area" style="fill:${s.c}" d="${d} L${xs[N - 1].toFixed(2)},100 L${xs[0].toFixed(2)},100 Z"/>` : ''}<path class="dc-halo" d="${d}"/><path class="dc-line" style="stroke:${s.c}" d="${d}"/>`; }).join('');
  const ends = shown.map(s => `<span class="dc-dot" style="left:100%;top:${yOf(s.vals[N - 1]).toFixed(2)}%;background:${s.c}"></span>`).join('');
  const pts = esc(JSON.stringify({ xs, labels, series: shown.map(s => ({ name: s.name, c: s.c, vals: s.vals, txt: s.vals.map(v => (rel ? Math.round(v) : v) + unit), ys: s.vals.map(yOf) })) }));
  return `<div class="dc-plot" role="img" aria-label="${esc(aria || emptyMsg)}" data-points="${pts}">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line class="dc-grid" x1="0" x2="100" y1="0" y2="0"/><line class="dc-grid" x1="0" x2="100" y1="50" y2="50"/><line class="dc-grid base" x1="0" x2="100" y1="100" y2="100"/>
        ${lines}
      </svg>
      <span class="dc-y" style="top:0">${top}${unit}</span>${top % 2 ? '' : `<span class="dc-y" style="top:50%">${top / 2}${unit}</span>`}<span class="dc-y" style="top:100%">0${unit}</span>
      ${ends}
      ${shown.length ? '' : `<p class="dc-off muted">${esc(emptyMsg)}</p>`}
      <span class="dc-cross"></span><span class="dc-hdots"></span><div class="dc-tip"></div>
    </div>
    <div class="dc-axis" aria-hidden="true">${labels.map((l, i) => (N - 1 - i) % step ? '' : `<span style="left:${xs[i].toFixed(2)}%">${esc(l)}</span>`).join('')}</div>`;
}

function viewGoals(cov) {
  const tier = ui.goalTier || defaultGoalTier(), mixed = tier === 'all', shownSubj = goalTabSubjects();
  const all = sortedGoals().filter(g => mixed || g.tier === tier), q = norm(ui.goalSearch), kids = sortedChildren();
  const list = all.filter(g => ui.goalSubj.has(g.subject) && (!q || norm(searchText(g)).includes(q)));
  const allOn = shownSubj.every(k => ui.goalSubj.has(k));
  let h = exampleBanner();
  h += `<section class="page-head"><div><h1>${esc(t('h_goals'))}</h1><p class="lede">${esc(t('goals_lede'))} <a href="https://onderwijsdoelen.be" target="_blank" rel="noopener">onderwijsdoelen.be</a>.</p></div></section>`;
  h += `<div class="toolbar">
      <select class="select" id="goal-tier" aria-label="${esc(t('tier_aria'))}">${tierOptions(tier)}</select>
      <input class="search" id="goal-search" type="search" placeholder="${esc(t('search_goals'))}" value="${esc(ui.goalSearch)}" aria-label="${esc(t('search_goals'))}"></div>
    <div class="chips-filter" role="group" aria-label="${esc(t('filter_subject'))}">
      <button class="fchip" data-action="goal-filter-all" aria-pressed="${allOn}">${bt('all_subjects')}</button>
      ${SUBJECTS.filter(s => shownSubj.includes(s.key)).map(s => `<button class="fchip" style="--c:${sv(s.key)}" data-action="goal-filter" data-key="${s.key}" aria-pressed="${ui.goalSubj.has(s.key)}"><span class="dot"></span>${bName(s.key, mixed ? null : tier)}</button>`).join('')}
    </div>
    <p class="count-line">${esc(t('count_line', list.length, all.length, kids.length))}</p>`;
  const MAX = 400;
  h += `<ul class="card goal-list">${list.slice(0, MAX).map(g => `<li class="goal-row">
      <span class="code" style="--c:${sv(g.subject)}"><span class="dot"></span>${esc(gCode(g) || '—')}</span>
      <div class="g-body"><p class="g-meta">${esc(sName(g.subject, g.tier))}${gCat(g) ? ' · ' + esc(gCat(g)) : ''}</p><p class="g-desc">${esc(gDesc(g))}</p></div>
      <div class="g-side">${kids.length ? `<span class="kids-row">${kids.filter(k => tierOf(k) === g.tier).map(k => { const done = !!k.mastered[g.id]; return `<span class="avatar sm ${done ? '' : 'off'}" title="${esc(done ? t('kid_done', k.name) : t('kid_open', k.name))}">${animalArt(k.animal)}</span>`; }).join('')}</span>` : ''}</div>
    </li>`).join('') || `<li class="goal-row"><p class="muted">${esc(t(all.length ? 'no_goals_found' : 'tier_soon'))}</p></li>`}</ul>`;
  if (list.length > MAX) h += `<p class="count-line">${esc(t('first_n', MAX))}</p>`;
  return h;
}

/* ---------- animal avatars ----------
   The drawings live in design/animals/ (one SVG per animal, listed in animals.json). tools/build.py
   adds them to the page as <symbol id="an-NAME"> elements and fills in this list of [emoji, name]
   pairs, in picker order. Children store the emoji as their animal; it only selects the drawing. */
const ANIMAL_LIST = [];
const ANIMALS = ANIMAL_LIST.map(a => a[0]);
const ANIMAL_ID = new Map(ANIMAL_LIST.map(([key, name]) => [key, 'an-' + name]));
/* Avatar contents for a stored animal: its drawing, or the stored text itself for anything unknown. */
const animalArt = a => ANIMAL_ID.has(a) ? `<svg viewBox="0 0 64 64" focusable="false"><use href="#${ANIMAL_ID.get(a)}"/></svg>` : esc(a);

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDialog(html, mount) {
  dlg.innerHTML = html;
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  mount && mount(dlg);
  const first = dlg.querySelector('[autofocus]'); if (first) first.focus();
}
function closeDialog() { if (dlg2.open) dlg2.close(); if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) closeDialog(); });
/* The close event comes late: when the dialog was opened again meanwhile, keep its new content. */
dlg.addEventListener('close', () => { if (!dlg.open) dlg.innerHTML = ''; });
const dlg2 = $('#dlg2');
dlg2.addEventListener('click', e => { if (e.target === dlg2 || e.target.closest('[data-close]')) dlg2.close(); });
dlg2.addEventListener('close', () => { if (!dlg2.open) dlg2.innerHTML = ''; });

/* No submitLabel: nothing to save or cancel (Instellingen applies every choice at once), so no footer;
   Sluiten at the top closes it. */
function shell(id, title, body, submitLabel = t('save'), extraClass = '') {
  return `<form class="dlg-form" id="${id}" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></header>
    <div class="dlg-body">${body}</div>
    ${submitLabel ? `<footer><p class="form-error" role="alert"></p><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button><button type="submit" class="btn ${extraClass || 'primary'}">${esc(submitLabel)}</button></footer>` : ''}
  </form>`;
}
function bindSubmit(d, handler) {
  const form = d.querySelector('form'), err = d.querySelector('.form-error'), btn = form.querySelector('[type=submit]');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = t('busy');
    try {
      const msg = await handler(form, (txt) => { btn.textContent = txt; });
      if (typeof msg === 'string') { err.textContent = msg; return; }
      closeDialog();
    } catch (ex) { err.textContent = errMsg(ex); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
  });
}
function confirmDialog(title, bodyHtml, confirmLabel, onConfirm) {
  openDialog(shell('f-confirm', title, bodyHtml, confirmLabel, 'danger'), d => bindSubmit(d, async () => { await onConfirm(); }));
}

/* child */
function childDialog(child) {
  const used = new Set([...data.children.values()].filter(c => !child || c.id !== child.id).map(c => c.animal));
  const free = ANIMALS.filter(a => !used.has(a));
  const current = child ? child.animal : (free.length ? free[Math.floor(Math.random() * free.length)] : ANIMALS[0]);
  const curTier = child ? tierOf(child) : DEFAULT_TIER;
  const body = `<label class="field"><span>${esc(t('name'))}</span><input id="c-name" name="name" maxlength="80" autocomplete="off" required autofocus value="${esc(child?.name || '')}"></label>
    <div class="field" role="radiogroup" aria-label="${esc(t('tier'))}"><span class="field-label">${esc(t('tier'))}</span>
      ${TIER_GROUPS.map(gr => `<p class="tier-row">${esc(gr.name[lang])}</p><div class="tier-grid">
      ${TIERS.filter(x => x.group === gr.key).map(x => `<label><input type="radio" name="tier" id="c-tier-${x.key}" value="${x.key}" ${x.key === curTier ? 'checked' : ''}><b>${esc(x.name[lang]).replace(/\S+-\S+/g, w => `<span class="tier-nw">${w}</span>`)}</b><small>${esc(x.ages[lang])} · ${esc(t('n_goals_short', goalsOfTier(x.key).length))}</small></label>`).join('')}
      </div>`).join('')}
    </div>
    <div class="field"><span class="field-label">${esc(t('animal'))}</span><div class="animal-grid" role="radiogroup" aria-label="${esc(t('animal'))}">
      ${ANIMALS.map((a, i) => `<label title="${used.has(a) ? esc(t('animal_taken')) : ''}"><input type="radio" name="animal" id="c-an-${i}" value="${esc(a)}" ${a === current ? 'checked' : ''} ${used.has(a) && free.length ? 'disabled' : ''}><span class="avatar" aria-hidden="true">${animalArt(a)}</span></label>`).join('')}
    </div></div>`;
  openDialog(shell('f-child', child ? t('child_edit_h') : t('child_add_h'), body), d => {

      if (dup) return t('err_dup_name', name);
      const animal = form.querySelector('input[name=animal]:checked')?.value || current;
      const tier = form.querySelector('input[name=tier]:checked')?.value || curTier;
      const now = Date.now();
      await put('children', child?.id || newId(), { ...(child ? bodyOf(child) : { createdAt: now }), name, animal, tier, updatedAt: now, example: false });
      toast(child ? t('saved_changes') : t('child_added', name));
    });

}
function deleteChild(id) {
  const c = data.children.get(id); if (!c) return;
  const affected = [...data.activities.values()].filter(a => a.childIds.includes(id));
  confirmDialog(t('child_del_h'), `<p>${t('child_del_q', esc(c.name))}</p><p class="muted">${esc(affected.length ? t('child_del_acts', c.name, affected.length) : t('child_del_none'))}</p>`, t('delete'), async () => {
    const errors = await runPool(affected, a => put('activities', a.id, { ...bodyOf(a), childIds: a.childIds.filter(x => x !== id), updatedAt: Date.now() }));
    if (errors.length) throw errors[0];
    await remove('children', id);
    if (ui.childId === id) { ui.view = 'overzicht'; ui.childId = null; }
    toast(t('child_deleted', c.name));
  });
}

/* One query per app open: the messages that started (minus the clock margin) and the account's seen list.
   A failure only reaches the console; the next app open tries again. */
async function loadMessages(user) {
  const { F, fs } = fb;
  const same = () => fbUser && fbUser.uid === user.uid;
  try {
    const [snap, prof] = await Promise.all([
      F.getDocs(F.query(F.collection(fs, 'messages'), F.where('startAt', '<=', Date.now() - CLOCK_MARGIN), F.orderBy('startAt', 'desc'), F.limit(50))),
      F.getDoc(F.doc(fs, 'users', user.uid, 'profile', 'main')),
    ]);
    if (!same()) return;
    const p = prof.exists() ? prof.data() : {};
    const msgs = snap.docs.map(d => Messages.clean(d.id, d.data())).filter(Boolean);
    const list = Messages.pending(msgs, { seen: Array.isArray(p.seen) ? p.seen : [], createdAt: Date.parse(user.metadata.creationTime) || 0, now: Date.now() });
    if (!list.length) return;
    const images = new Map();
    await Promise.all(list.flatMap(m => [...new Set(m.langs.flatMap(l => Messages.imageRefs(m.body[l])))].map(async id => {
      /* one missing or unreadable image drops that image only, never the whole message load */
      const s = await F.getDoc(F.doc(fs, 'messages', m.id, 'images', id)).catch(() => null);
      const d = s && s.exists() ? s.data() : null;
      if (d && typeof d.data === 'string') images.set(`${m.id}/${id}`, { src: 'data:image/jpeg;base64,' + d.data, w: Number(d.w) || 0 });
    })));
    if (same()) showMessages(list, images, markSeen);
  } catch (e) { console.warn('doelenboek: messages not loaded', e && e.code); }
}
/* Adds the message id to the account's seen list. The profile's other fields go along, because the rules
   require them when the profile doesn't exist yet. A failure is ignored: the message shows again next time. */
async function markSeen(id) {
  const user = fbUser; if (!user || !fb) return;
  const { F, fs } = fb, now = Date.now();
  try {
    await F.setDoc(F.doc(fs, 'users', user.uid, 'profile', 'main'),
      { email: user.email || '', createdAt: Date.parse(user.metadata.creationTime) || now, lastSeen: now, seen: F.arrayUnion(id) }, { merge: true });
  } catch (e) { console.warn('doelenboek: message not marked as seen', e && e.code); }
}

const peek = $('#peek'), peekImg = peek.querySelector('img');
let peekFor = null;
function showPeek(th) {
  const img = th.querySelector('img');
  if (!img || !img.complete || !img.naturalWidth) return;
  peekFor = th;
  const vw = window.innerWidth, vh = window.innerHeight, r = th.getBoundingClientRect();
  const s = Math.min(Math.min(440, vw - 32) / img.naturalWidth, Math.min(440, vh - 32) / img.naturalHeight);
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  let left = r.right + 12;
  if (left + w > vw - 16) left = r.left - 12 - w;
  if (left < 16) left = Math.max(16, (vw - w) / 2);
  const top = Math.min(Math.max(16, r.top + r.height / 2 - h / 2), vh - 16 - h);
  peekImg.src = img.src;
  Object.assign(peek.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
  peek.hidden = false;
  requestAnimationFrame(() => { if (peekFor === th) peek.classList.add('show'); });
}

/* ---------- Firebase accounts ----------
   Each account's data lives under users/{uid}/{children|activities|photos}/{id}; the
   Firestore rules only let that account read or write it. firestoreStore() exposes the same small
   interface as the Claude-hosted store, so the rest of the app runs unchanged in mode 'db'. */
let fb = null, fbUser = null, unsubs = [];
const ui_auth = { view: 'login', email: '', msg: '', err: '' };

async function startFirebase() {
  try {
    const [appM, authM, fsM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
    const cfg = { ...FIREBASE_CONFIG }, emu = cfg.emulator; delete cfg.emulator;
    const app = appM.initializeApp(cfg);
    const auth = authM.getAuth(app);
    let fs;
    try { fs = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch (e) { fs = fsM.getFirestore(app); }
    if (emu) { authM.connectAuthEmulator(auth, emu.auth, { disableWarnings: true }); fsM.connectFirestoreEmulator(fs, emu.host, emu.port); }
    fb = { auth, fs, A: authM, F: fsM };
    authM.onAuthStateChanged(auth, user => { if (user) enterAccount(user); else leaveAccount(); });
  } catch (e) {
    mode = 'auth'; ui_auth.err = t('sdk_fail'); render();
  }
}
function fbErr(e) {
  const map = { 'permission-denied': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unauthenticated': 'revoked', 'invalid-argument': 'invalid_argument' };
  const err = new Error(e && e.message); err.code = map[e && e.code] || 'unavailable'; err.fbCode = e && e.code;
  return err;
}

  const ref = (c, id) => F.doc(fs, 'users', uid, c, id);
  const snap = d => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  /* Writes apply locally at once and sync in the background; offline they would never resolve,
     so stop waiting after a moment and report a later rejection as a toast. */
  const settle = p => new Promise((resolve, reject) => {
    let waiting = true;
    const timer = setTimeout(() => { waiting = false; resolve(); }, 2500);
    p.then(() => { if (waiting) { clearTimeout(timer); resolve(); } },
      e => { if (waiting) { clearTimeout(timer); reject(fbErr(e)); } else toast(t('late_write_fail'), true); });
  });
  const docApi = (c, id) => ({
    set: d => settle(F.setDoc(ref(c, id), d)),
    delete: () => settle(F.deleteDoc(ref(c, id))),
    get: () => F.getDoc(ref(c, id)).then(snap, e => { throw fbErr(e); }),
  });
  return {
    collection: c => ({
      doc: id => docApi(c, id),
      onSnapshot: (next, error) => F.onSnapshot(col(c), s => next({ docs: s.docs.map(snap) }), e => error && error(fbErr(e))),
    }),
    doc: path => { const [c, id] = path.split('/'); return docApi(c, id); },
  };
}
function resetData() {
  data.children = new Map(); data.activities = new Map();
  for (const c of COLS) loaded[c] = false;
}
function subscribeAll() {
  for (const u of unsubs) u();
  unsubs = COLS.map(c => db.collection(c).onSnapshot(s => {
    const m = new Map();
    for (const doc of s.docs) { if (!doc.exists) continue; const b = clean(c, doc.data()); if (b) m.set(doc.id, { ...b, id: doc.id }); }
    data[c] = m;
    loaded[c] = true; scheduleRender();
  }, err => {
    loaded[c] = true; scheduleRender();
    toast(err && err.code === 'revoked' ? t('err_revoked') : t('err_conn'), true);
  }));
}
function enterAccount(user) {
  if (fbUser && fbUser.uid === user.uid) return;
  fbUser = user; db = firestoreStore(user.uid);
  $('#admin-link').hidden = !ADMIN_UID || user.uid !== ADMIN_UID;
  mode = 'db'; canWrite = true; canWriteKnown = true;
  resetData(); closeDialog(); render(); subscribeAll();
  readLocalSummary();
  writeProfile(user);
  loadMessages(user);
}
function leaveAccount() {
  for (const u of unsubs) u();
  unsubs = []; fbUser = null; db = null;
  msgQueue = null; if (msgDlg.open) msgDlg.close();
  $('#admin-link').hidden = true;
  resetData(); closeDialog();
  mode = 'auth'; render();
}
/* The small users/{uid}/profile/main record the /admin/ page counts with: email, sign-up date and the
   last day this account opened the app. Written at most once a day; a failure never bothers the user. */
async function writeProfile(user) {
  const { F, fs } = fb;
  const ref = F.doc(fs, 'users', user.uid, 'profile', 'main');
  const now = Date.now();
  try {
    const s = await F.getDoc(ref);
    const p = s.exists() ? s.data() : null;
    if (p && p.email === user.email && typeof p.lastSeen === 'number' && new Date(p.lastSeen).toDateString() === new Date(now).toDateString()) return;
    await F.setDoc(ref, { email: user.email || '', createdAt: Date.parse(user.metadata.creationTime) || now, lastSeen: now }, { merge: true });   // merge: keeps 'seen'
  } catch (e) { console.warn('doelenboek: profile not saved', e && e.code); }
}

/* login / sign-up / reset screen */
function authView() {
  const v = ui_auth.view;
  const head = { login: ['auth_h'], signup: ['signup_h', 'signup_p'], reset: ['reset_h', 'reset_p'] }[v];
  const eye = `<button type="button" class="pw-eye" aria-pressed="false" aria-label="${esc(t('show_pw'))}" title="${esc(t('show_pw'))}">${ICON_EYE}${ICON_EYE_OFF}</button>`;
  const pw = v === 'reset' ? '' : `<label class="field"><span>${esc(t('password'))}</span><span class="pw-wrap"><input id="au-pw" name="password" type="password" autocomplete="${v === 'signup' ? 'new-password' : 'current-password'}" required>${eye}</span></label>`;
  const pw2 = v === 'signup' ? `<label class="field"><span>${esc(t('password2'))}</span><span class="pw-wrap"><input id="au-pw2" name="password2" type="password" autocomplete="new-password" required>${eye}</span><span class="hint">${esc(t('pw_hint'))}</span></label>` : '';
  const submit = { login: 'login', signup: 'signup', reset: 'reset_btn' }[v];
  const links = v === 'login'
    ? `<button type="button" class="linkish" data-action="auth-view" data-v="signup">${bt('to_signup')}</button><button type="button" class="linkish" data-action="auth-view" data-v="reset">${bt('forgot')}</button>`
    : `<button type="button" class="linkish" data-action="auth-view" data-v="login">${bt(v === 'signup' ? 'to_login' : 'back_login')}</button>`;
  const langs = ['nl', 'en'].map(l => `<button type="button" data-lang="${l}" aria-pressed="${l === lang}" lang="${l}" title="${l === 'nl' ? 'Nederlands' : 'English'}">${l.toUpperCase()}</button>`).join('');
  return `<section class="card auth">
    <div class="lang-switch card-switch auth-lang" role="group" aria-label="Taal / Language">${langs}</div>
    <div><h1 class="auth-title"><span class="auth-logo" aria-hidden="true"></span><span>${esc(t(head[0]))}</span></h1>${head[1] ? `<p class="lede">${esc(t(head[1]))}</p>` : ''}</div>
    ${v === 'reset' ? '' : `<p class="auth-about"><span class="bi">${['nl', 'en'].map(l => `<span lang="${l}"${l === lang ? '' : ' class="off" aria-hidden="true"'}><strong>${esc(tIn(l, 'about_h'))}</strong><br>${esc(tIn(l, 'about_p'))}</span>`).join('')}</span></p>`}
    <form id="auth-form" novalidate>
      <label class="field"><span>${esc(t('email'))}</span><input id="au-email" name="email" type="email" autocomplete="email" inputmode="email" required value="${esc(ui_auth.email)}"></label>
      ${pw}${pw2}
      <p class="form-error" id="au-err" role="alert">${esc(ui_auth.err)}</p>
      ${ui_auth.msg ? `<p class="info" role="status">${esc(ui_auth.msg)}</p>` : ''}
      <button class="btn primary" type="submit" ${fb ? '' : 'disabled'}>${bt(submit)}</button>
    </form>
    <div class="auth-links">${links}</div>
    <p class="privacy"><button type="button" class="linkish auth-privacy">${bt('privacy_link')}</button></p>
  </section>`;
}
function authErr(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|missing-password/.test(c)) return t('ae_invalid');
  if (c.includes('email-already-in-use')) return t('ae_inuse');
  if (/invalid-email|missing-email/.test(c)) return t('ae_email');
  if (c.includes('weak-password')) return t('ae_weak');
  if (c.includes('too-many-requests')) return t('ae_many');
  if (c.includes('network-request-failed')) return t('ae_net');
  return t('ae_generic');
}
async function submitAuth(form) {
  if (!fb) return;
  const { A, auth } = fb, v = ui_auth.view;
  const email = form.email.value.trim(), err = form.querySelector('#au-err'), btn = form.querySelector('[type=submit]');
  ui_auth.email = email; ui_auth.err = ''; ui_auth.msg = '';
  err.textContent = '';
  form.querySelector('.info')?.remove();
  if (!email) { err.textContent = t('err_email_empty'); return; }
  if (v === 'signup') {
    if (form.password.value.length < 8) { err.textContent = t('err_pw_short'); return; }
    if (form.password.value !== form.password2.value) { err.textContent = t('err_pw_match'); return; }
  }
  const label = btn.textContent; btn.disabled = true; btn.textContent = t('busy');
  try {
    if (v === 'login') await A.signInWithEmailAndPassword(auth, email, form.password.value);
    else if (v === 'signup') await A.createUserWithEmailAndPassword(auth, email, form.password.value);
    else {
      auth.languageCode = lang;
      await A.sendPasswordResetEmail(auth, email);
      ui_auth.msg = t('reset_sent'); render();
    }
  } catch (e) {
    if (btn.isConnected) { err.textContent = authErr(e); btn.disabled = false; btn.textContent = label; }
    return;
  }
  if (btn.isConnected) { btn.disabled = false; btn.textContent = label; }
}
/* Signing out also wipes this browser's offline copy of the account, so the next person on a
   shared computer finds nothing. */
async function logout() {
  if (!fb) return;
  try { await fb.A.signOut(fb.auth); } catch (e) {}
  try { await fb.F.terminate(fb.fs); await fb.F.clearIndexedDbPersistence(fb.fs); } catch (e) { console.warn('doelenboek: could not clear offline copy', e && e.code, e && e.message); }
  location.reload();
}
function deleteAccountDialog() {
  const body = `<p>${esc(t('del_acc_p'))}</p><label class="field"><span>${esc(t('del_acc_confirm'))}</span><input id="da-pw" name="password" type="password" autocomplete="current-password" autofocus></label>`;
  openDialog(shell('f-delacc', t('del_acc'), body, t('del_acc_btn'), 'danger'), d => bindSubmit(d, async form => {
    const { A, F, auth, fs } = fb, user = auth.currentUser;
    if (!user) return t('ae_generic');
    try { await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, form.password.value)); }
    catch (e) { return authErr(e); }
    /* 'goals' holds goals parents could once add themselves; cleared along with the rest, as is the admin profile */
    for (const c of [...COLS, 'goals', 'photos', 'profile']) {
      const s = await F.getDocs(F.collection(fs, 'users', user.uid, c));
      const errors = await runPool(s.docs, docSnap => F.deleteDoc(docSnap.ref), 6);
      if (errors.length) throw fbErr(errors[0]);
    }
    try { await A.deleteUser(user); } catch (e) { return authErr(e); }
    try { localStorage.removeItem(MIGRATED_KEY + user.uid); } catch (e) {}
    try { await F.terminate(fs); await F.clearIndexedDbPersistence(fs); } catch (e) {}
    toast(t('del_done'));
    setTimeout(() => location.reload(), 600);
  }));
}

/* One-time offer to move data saved in this browser (before accounts existed) into the account. */
let localSummary = null;
function readLocalSummary() {
  localSummary = null;
  try {
    const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!o) return;
    const n = c => Object.keys(o[c] || {}).length;
    if (n('children') + n('activities')) localSummary = { o, children: n('children'), activities: n('activities') };
  } catch (e) {}
}
function migrationNotice() {
  if (!fbUser || !localSummary) return '';
  try { if (localStorage.getItem(MIGRATED_KEY + fbUser.uid)) return ''; } catch (e) { return ''; }
  if (data.children.size || data.activities.size) return '';
  return `<div class="notice"><p>${esc(t('mig_p', localSummary.children, localSummary.activities))}</p><span class="head-actions"><button class="btn small" data-action="migrate">${bt('mig_btn')}</button><button class="btn small" data-action="migrate-skip">${bt('mig_skip')}</button></span></div>`;
}
function markMigrated() { try { localStorage.setItem(MIGRATED_KEY + fbUser.uid, todayIso()); } catch (e) {} scheduleRender(); }
async function migrateLocal(btn) {
  const o = localSummary && localSummary.o; if (!o || !fbUser) return;
  btn.disabled = true;
  const docs = [];
  for (const c of COLS) for (const [id, v] of Object.entries(o[c] || {})) { if (!ID_RE.test(id)) continue; const b = clean(c, v); if (b) docs.push({ c, id, b }); }
  const used = new Set(docs.filter(x => x.c === 'activities').flatMap(x => x.b.photoIds));
  let photos = [];
  try { photos = used.size ? (await localPhotosAll()).filter(p => used.has(p.id)) : []; } catch (e) {}
  const total = docs.length + photos.length;
  let n = 0;
  const step = () => { btn.textContent = t('progress', ++n, total); };
  const errors = await runPool(photos, async p => { await photoStore.put(p.id, p.rec); step(); }, 3);
  errors.push(...await runPool(docs, async x => { await put(x.c, x.id, x.b); step(); }, 4));
  if (errors.length) { toast(t('r_partial', errors.length, total, errMsg(errors[0])), true); btn.disabled = false; btn.textContent = t('mig_btn'); return; }
  markMigrated();
  toast(t('mig_done', total));
}

/* ---------- start ---------- */
function startLocal() {
  mode = 'local'; loadLocal(); render();
}
async function init() {
  fromHash();
  if (FIREBASE_CONFIG) { render(); startFirebase(); return; }
  if (!window.claude || typeof window.claude.use !== 'function') { startLocal(); return; }
  let d = null, u = null;
  try { [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }
  catch (e) { d = null; }
  if (!d) { startLocal(); toast(t('err_no_shared'), true); return; }
  db = d; mode = 'db';
  if (u) { try { const c = await u.can('data.write'); if (c === true || c === false) { canWrite = c; canWriteKnown = true; } } catch (e) {} }
  render();
  subscribeAll();
}
init();
})();
</script>
