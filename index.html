<style>
/* Layout: sticky header with three tabs over one working column; child cards in a responsive grid, goals and activities as dense lists. */
:root {
  --bg: #F4F6F1;
  --surface: #FFFFFF;
  --surface-2: #E9EDE5;
  --fg: #1B2420;
  --muted: #5A6862;
  --line: #D6DCD3;
  --accent: #1F6F78;
  --accent-fg: #FFFFFF;
  --danger: #B3261E;
  --ok: #2E7D4F;
  --warn-bg: #FBF0D2;
  --warn-fg: #5A4200;

  /* subject colours, from the original Unity palette */
  --s-nl: #2A9D8F;
  --s-wk: #264653;
  --s-wt: #B56576;
  --s-ge: #E08A47;
  --s-ak: #E76F51;
  --s-mv: #D4A93E;
  --s-lo: #7FA872;
  --s-at: #6D597A;

  --f-display: "Clarity City", "Segoe UI", system-ui, sans-serif;
  --f-body: "Clarity City", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --r: 10px;
  --shadow: 0 1px 2px rgb(20 30 25 / .06), 0 6px 20px rgb(20 30 25 / .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #192019; --surface-2: #242C27; --fg: #E5EBE7; --muted: #9AA8A1; --line: #2F3934;
    --accent: #62BAC2; --accent-fg: #0B1E20; --danger: #F08A82; --ok: #74C795; --warn-bg: #3A3016; --warn-fg: #F2DE9F;
    --s-wk: #7EA8BB; --s-at: #A88FBB; --s-wt: #D0899A;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #192019; --surface-2: #242C27; --fg: #E5EBE7; --muted: #9AA8A1; --line: #2F3934;
  --accent: #62BAC2; --accent-fg: #0B1E20; --danger: #F08A82; --ok: #74C795; --warn-bg: #3A3016; --warn-fg: #F2DE9F;
  --s-wk: #7EA8BB; --s-at: #A88FBB; --s-wt: #D0899A;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
/* the empty space after the name keeps it visually apart from the tabs */
.brand { display: flex; align-items: baseline; min-width: 0; margin-right: clamp(8px, 9vw, 140px); }
.brand b { font-family: var(--f-display); font-size: 1.3rem; letter-spacing: -0.02em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a {
  text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-weight: 700; font-size: .92rem;
}
.tabs a:hover { color: var(--fg); background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--accent-fg); background: var(--accent); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.ok::before { background: var(--ok); }
.status.warn::before { background: #D99A1E; }
/* both languages share one grid cell; the hidden one keeps the width (see both()) */
.bi { display: inline-grid; justify-items: center; }
.bi > span { grid-area: 1 / 1; }
.bi > .off { visibility: hidden; }
.status .bi { justify-items: start; }   /* keep the text next to the status dot */
.lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang-switch button { border: 0; background: transparent; padding: 4px 10px; font-size: .78rem; font-weight: 700; color: var(--muted); cursor: pointer; letter-spacing: .04em; }
.lang-switch button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .9rem; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.small { padding: 5px 10px; font-size: .82rem; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn { border: 0; background: transparent; color: var(--muted); padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: .82rem; font-weight: 700; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.del:hover { color: var(--danger); }
.readonly .w { display: none !important; }

/* page head */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.page-head > div:first-child { min-width: 0; }
.lede { color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; max-width: 70ch; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice p { min-width: 0; flex: 1 1 280px; }
.notice .btn { background: transparent; border-color: currentColor; color: inherit; }

.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h2 { color: var(--fg); }
.empty pre { text-align: left; background: var(--surface-2); color: var(--fg); padding: 10px 14px; border-radius: 8px; font-family: var(--f-mono); font-size: .8rem; max-width: 100%; overflow-x: auto; margin: 4px 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* avatars */
.avatar { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); font-size: 17px; line-height: 1; flex: none; }
.avatar.lg { width: 52px; height: 52px; font-size: 30px; }
.avatar.sm { width: 24px; height: 24px; font-size: 13px; }
.avatar.off { opacity: .28; filter: grayscale(1); }

/* child cards */
.child-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
.child-card { display: grid; gap: 14px; padding: 16px; }
.cc-head { display: flex; gap: 12px; align-items: center; }
.cc-id { min-width: 0; flex: 1; }
.cc-id h2 { overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: .84rem; }
.cc-pct { text-align: right; display: grid; font-variant-numeric: tabular-nums; }
.cc-pct strong { font-family: var(--f-display); font-size: 1.7rem; line-height: 1; }
.cc-pct small { font-size: .9rem; color: var(--muted); }
.cc-pct span { color: var(--muted); font-size: .76rem; }
.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.bars li { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr 3.6rem; gap: 10px; align-items: center; font-size: .84rem; }
.bars li.none { color: var(--muted); }
.b-lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: block; }
.bar i { display: block; height: 100%; border-radius: 99px; min-width: 0; transition: width .4s ease; }
.b-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-family: var(--f-mono); font-size: .76rem; }
.cc-foot { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
.select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
.chips-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 8px; cursor: pointer; font-size: .82rem; font-weight: 700; color: var(--muted); }
.fchip .dot { opacity: .35; }
.fchip[aria-pressed="true"] { color: var(--fg); border-color: color-mix(in srgb, var(--c, var(--fg)) 55%, var(--line)); background: color-mix(in srgb, var(--c, var(--fg)) 12%, var(--surface)); }
.fchip[aria-pressed="true"] .dot { opacity: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; display: inline-block; }
.count-line { color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }

/* goal list */
.goal-list { list-style: none; margin: 0; padding: 0; display: grid; }
.goal-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.goal-row:last-child { border-bottom: 0; }
.code { font-family: var(--f-mono); font-size: .78rem; display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--c, var(--muted)) 16%, transparent); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; justify-self: start; }
.g-body { min-width: 0; display: grid; gap: 2px; }
.g-meta { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.g-desc { overflow-wrap: anywhere; white-space: pre-line; }
.g-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.kids-row { display: flex; gap: 3px; }
.row-actions { display: flex; gap: 2px; }
.tag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
@media (max-width: 640px) {
  .goal-row { grid-template-columns: minmax(0, 1fr); }
  .g-side { justify-content: flex-start; }
}

/* activities */
.month { font-family: var(--f-display); font-size: 1rem; color: var(--muted); text-transform: capitalize; margin-top: 8px; }
.act-list { display: grid; gap: 10px; }
.act { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: 14px; padding: 14px; align-items: start; }
.act-date { text-align: center; border-right: 1px solid var(--line); padding-right: 12px; display: grid; }
.act-date .d { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.act-date .m { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.act-body { min-width: 0; display: grid; gap: 8px; }
.act-body h3 { overflow-wrap: anywhere; }
.act-kids { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .86rem; color: var(--muted); }
.act-kids span { display: inline-flex; align-items: center; gap: 5px; }
.goal-chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.goal-chips .code { cursor: help; }
.goal-chips .goal-chip:hover, .goal-chips .goal-chip:focus-visible { background: color-mix(in srgb, var(--c, var(--muted)) 30%, transparent); }
/* goal preview card, shown while hovering a goal code */
.gpeek { position: fixed; z-index: 60; pointer-events: none; width: min(380px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgb(0 0 0 / .25); padding: 12px 14px; display: grid; gap: 6px; opacity: 0; transform: translateY(4px); transition: opacity .15s ease, transform .15s ease; }
.gpeek.show { opacity: 1; transform: none; }
.gpeek-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .82rem; font-weight: 700; }
.gpeek-head .code { font-weight: 500; }
.gpeek .g-meta { margin: 0; }
.gpeek .g-desc { font-size: .92rem; line-height: 1.45; }
.notes { color: var(--muted); font-size: .9rem; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 560px) {
  .act { grid-template-columns: 3rem minmax(0, 1fr); }
  .act .row-actions { grid-column: 2; }
}

/* child detail */
.back { justify-self: start; }
.kid-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.kid-head .kid-name { flex: 1 1 200px; min-width: 0; }
.kid-head h1 { overflow-wrap: anywhere; }
.subj { padding: 0; overflow: hidden; }
.subj summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(80px, 200px) 3.6rem; gap: 12px; align-items: center; padding: 12px 16px; }
.subj summary::-webkit-details-marker { display: none; }
.subj summary h2 { font-size: 1.05rem; }
.subj[open] summary { border-bottom: 1px solid var(--line); }
.status-list { list-style: none; margin: 0; padding: 0; }
.status-list li { display: grid; grid-template-columns: 18px 7.5rem minmax(0, 1fr); gap: 12px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.status-list li:last-child { border-bottom: 0; }
.mark { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.done .mark { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 2px var(--surface); }
.via { font-size: .82rem; color: var(--ok); margin-top: 2px; }
@media (max-width: 560px) {
  .subj summary { grid-template-columns: auto minmax(0, 1fr) 3.6rem; }
  .subj summary .bar { grid-column: 1 / -1; grid-row: 2; }
  .status-list li { grid-template-columns: 18px minmax(0, 1fr); }
  .status-list li .code { grid-column: 2; }
  .status-list li > div { grid-column: 2; }
}
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: .9rem; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: min(92vh, 900px); background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
dialog::backdrop { background: rgb(10 20 15 / .45); }
.dlg-form { display: flex; flex-direction: column; max-height: min(92vh, 900px); }
.dlg-form > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.dlg-body { padding: 16px 18px; overflow-y: auto; display: grid; gap: 14px; min-height: 0; }
.dlg-form > footer { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.form-error { color: var(--danger); font-size: .88rem; margin-right: auto; flex: 1 1 200px; min-width: 0; }
.field { display: grid; gap: 5px; }
.field > span, .field-label { font-weight: 700; font-size: .86rem; }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; width: 100%; }
.field textarea { resize: vertical; min-height: 80px; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.kid-picks { display: flex; flex-wrap: wrap; gap: 6px; }
.kid-pick { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 4px; cursor: pointer; position: relative; }
.kid-pick:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.kid-pick input { position: absolute; opacity: 0; pointer-events: none; }
.kid-pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.animal-grid { display: grid; grid-template-columns: repeat(auto-fill, 46px); gap: 6px; }
.animal-grid label { display: grid; place-items: center; height: 46px; border-radius: 10px; border: 1px solid var(--line); font-size: 24px; cursor: pointer; position: relative; }
.animal-grid input { position: absolute; opacity: 0; pointer-events: none; }
.animal-grid label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: 0 0 0 1px var(--accent); }
.animal-grid label:has(input:disabled) { opacity: .25; cursor: not-allowed; }
.animal-grid label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
/* goal picker: a second dialog stacked on top of the activity form */
#dlg2 { width: min(880px, calc(100vw - 24px)); }
.picker-dlg { height: min(92vh, 900px); }
.picker-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.picker-bar .search { flex-basis: 180px; }
.picker-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.pick-group { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: 8px 18px 6px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.pick-count { margin-right: auto; flex: 1 1 160px; min-width: 0; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.goal-field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick { display: grid; grid-template-columns: 20px 7rem minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 18px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .9rem; }
.pick:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.pick input { margin-top: 4px; }
.pick-more { padding: 10px; color: var(--muted); font-size: .84rem; text-align: center; }
.sel-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.sel-chips button { border: 0; cursor: pointer; }
.sel-chips button::after { content: "×"; margin-left: 2px; opacity: .6; }
.import-preview { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .88rem; display: grid; gap: 4px; }
.import-preview ul { margin: 0; padding-left: 18px; color: var(--danger); max-height: 140px; overflow-y: auto; }
.data-actions { display: grid; gap: 12px; }
.data-actions > div { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.data-actions > div:last-child { border-bottom: 0; padding-bottom: 0; }
.data-actions p { flex: 1 1 260px; min-width: 0; }
.data-actions p b { display: block; }
.data-actions p span { color: var(--muted); font-size: .86rem; }
.file-label { position: relative; overflow: hidden; }
.file-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--danger); color: var(--surface); }

function loadLocal() {

      const m = new Map();
      for (const [id, v] of Object.entries(o[c] || {})) { const d = clean(c, v); if (d && ID_RE.test(id)) m.set(id, { ...d, id }); }
      if (c === 'goals') setGoals(m); else data[c] = m;

}

}

  const doc = clean(col, body);

  if (mode === 'db') return retry(() => db.collection(col).doc(id).set(doc));
  if (col === 'goals') { const m = new Map(customGoals); m.set(id, { ...doc, id }); setGoals(m); }

/* ---------- photos ----------
   A photo is {mime, w, h, data (base64 JPEG), createdAt}. Activities hold only photo ids.
   Shared store: one document per photo in "photos", fetched on demand (never subscribed).
   Browser-only: IndexedDB, because localStorage is far too small for images. */
function cleanPhoto(r) {
  if (!r || typeof r !== 'object') return null;
  const mime = ['image/jpeg', 'image/png', 'image/webp'].includes(r.mime) ? r.mime : null;
  const ok = typeof r.data === 'string' && r.data.length <= 400000 && /^[A-Za-z0-9+/]+=*$/.test(r.data);
  if (!mime || !ok) return null;
  return { mime, w: Number(r.w) || 0, h: Number(r.h) || 0, data: r.data, createdAt: typeof r.createdAt === 'number' ? r.createdAt : 0 };
}
let idbPromise = null;
function idb() {
  if (!idbPromise) idbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('no indexedDB')); return; }
    const r = indexedDB.open('doelenboek', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);

    tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);

  async get(id) {

    return cleanPhoto(await idbRun('readonly', st => st.get(id)));
  },
  async put(id, rec) {
    if (mode === 'db') return retry(() => db.collection('photos').doc(id).set(rec));
    return idbRun('readwrite', st => st.put(rec, id));
  },
  async del(id) {

function localPhotosAll() {

    photoPending.set(id, photoStore.get(id)
      .then(rec => { const u = rec ? b64ToUrl(rec) : null; photoUrl.set(id, u); return u; })
      .catch(() => null)
      .finally(() => photoPending.delete(id)));

/* Decode, downscale and JPEG-encode in the browser; steps down until it fits PHOTO_MAX_B64. */
async function processImage(file) {
  let src, cleanup = () => {};
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); cleanup = () => src.close && src.close(); }
  catch (e) {
    const url = URL.createObjectURL(file), img = new Image();

    for (let i = 0; i < steps.length; i++) {

      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(src, 0, 0, w, h);

      if (data.length <= PHOTO_MAX_B64 || i === steps.length - 1) return { mime: 'image/jpeg', w, h, data };
    }
  } finally { cleanup(); }
}

/* ---------- derived data ---------- */
const byGoalOrder = (a, b) => (SUBJ[a.subject].i - SUBJ[b.subject].i) || a.code.localeCompare(b.code, 'nl', { numeric: true }) || a.description.localeCompare(b.description, 'nl');
const sortedGoals = () => [...data.goals.values()].sort(byGoalOrder);
const sortedChildren = () => [...data.children.values()].sort((a, b) => a.name.localeCompare(b.name, 'nl'));
const byDateDesc = (a, b) => b.date.localeCompare(a.date) || (b.createdAt - a.createdAt);
const activitiesFor = cid => [...data.activities.values()].filter(a => a.childIds.includes(cid)).sort(byDateDesc);
function subjectTotals() { const tt = {}; for (const g of data.goals.values()) tt[g.subject] = (tt[g.subject] || 0) + 1; return tt; }
/* childId -> Map(goalId -> [activities, oldest first]) */
function buildCoverage() {
  const cov = new Map();
  for (const id of data.children.keys()) cov.set(id, new Map());
  const acts = [...data.activities.values()].sort((a, b) => a.date.localeCompare(b.date));
  for (const a of acts) for (const cid of a.childIds) {
    const m = cov.get(cid); if (!m) continue;
    for (const gid of a.goalIds) { if (!data.goals.has(gid)) continue; if (!m.has(gid)) m.set(gid, []); m.get(gid).push(a); }
  }
  return cov;
}
function countBySubject(m) { const c = {}; if (m) for (const gid of m.keys()) { const g = data.goals.get(gid); if (g) c[g.subject] = (c[g.subject] || 0) + 1; } return c; }
const exampleItems = () => COLS.flatMap(c => [...(c === 'goals' ? customGoals : data[c]).values()].filter(d => d.example).map(d => ({ c, id: d.id })));

/* ---------- rendering ---------- */
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

function renderChrome() {
  document.documentElement.lang = lang;
  $('#data-btn').innerHTML = bt('data_btn');
  for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  document.body.classList.toggle('chrome-off', mode === 'auth' || (mode === 'loading' && !!FIREBASE_CONFIG));
  const foot = $('#site-foot');
  foot.textContent = mode === 'local' ? t('foot_local') : fbUser ? t('foot_fb') : t('foot_db');
  foot.hidden = mode === 'loading' || mode === 'auth' || !foot.textContent;
  const st = $('#status');
  st.removeAttribute('title');
  if (mode === 'loading') { st.innerHTML = bt('st_connecting'); st.className = 'status'; }
  else if (mode === 'db' && fbUser) { st.textContent = fbUser.email; st.title = t('signed_in_as', fbUser.email); st.className = 'status ok'; }
  else if (mode === 'db') { st.innerHTML = bt(canWrite ? 'st_saved' : 'st_readonly'); st.className = 'status ok'; }
  else { st.innerHTML = bt('st_local'); st.className = 'status warn'; }
  for (const a of document.querySelectorAll('[data-tab]')) {
    a.innerHTML = bt('tab_' + a.dataset.tab);
    const active = a.dataset.tab === ui.view || (ui.view === 'kind' && a.dataset.tab === 'overzicht');
    if (active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
}

function render() {
  document.body.classList.toggle('readonly', !canWrite);
  renderChrome();
  const main = $('#main');
  const ae = document.activeElement;
  const fid = ae && main.contains(ae) && ae.id ? ae.id : null;
  let s0 = null, s1 = null; try { s0 = ae.selectionStart; s1 = ae.selectionEnd; } catch (e) {}

  if (mode === 'auth') {
    main.innerHTML = authView();
    const el = fid && document.getElementById(fid); if (el) el.focus({ preventScroll: true });
    return;
  }
  if (mode === 'loading' || (mode === 'db' && !COLS.every(c => loaded[c]))) { main.innerHTML = `<p class="loading">${esc(t('loading'))}</p>`; return; }
  const cov = buildCoverage();
  let html;
  if (ui.view === 'kind') html = viewChild(cov);
  else if (ui.view === 'activiteiten') html = viewActivities();
  else if (ui.view === 'doelen') html = viewGoals(cov);
  else html = viewOverview(cov);
  hidePeek();
  main.innerHTML = html;
  hydratePhotos(main);

  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} } }
}

/* Banners shown at the top of every main view. */
function exampleBanner() {
  if (!exampleItems().length) return migrationNotice();
  return `<div class="notice"><p>${t('example_banner')}</p><button class="btn small w" data-action="remove-examples">${bt('remove_examples')}</button></div>`;
}
function noGoalsNotice() {
  if (data.goals.size) return '';

}

function barRow(label, key, n, tot) {
  const p = tot ? Math.round(100 * n / tot) : 0;
  return `<li class="${tot ? '' : 'none'}"><span class="b-lbl">${esc(label)}</span><span class="bar" role="img" aria-label="${esc(label)}: ${n} / ${tot}"><i style="width:${p}%;background:${sv(key)}"></i></span><span class="b-num">${tot ? `${n}/${tot}` : '—'}</span></li>`;
}

function viewOverview(cov) {
  const kids = sortedChildren(), totals = subjectTotals(), total = data.goals.size;
  let h = exampleBanner();
  h += `<section class="page-head"><div><h1>${esc(t('h_overview'))}</h1><p class="lede">${esc(t('n_children', kids.length))} · ${esc(t('n_goals', total))} · ${esc(t('n_acts', data.activities.size))}</p></div>
    <div class="head-actions w"><button class="btn" data-action="add-child">${bt('add_child')}</button><button class="btn primary" data-action="new-activity" ${kids.length ? '' : 'disabled'}>${bt('add_activity')}</button></div></section>`;
  h += noGoalsNotice();
  if (!kids.length) {
    return h + `<div class="empty"><h2>${esc(t('empty_kids_h'))}</h2><p>${esc(t('empty_kids_p'))}</p><button class="btn primary w" data-action="add-child">${bt('add_child')}</button></div>`;
  }
  h += `<div class="child-grid">${kids.map(c => {
    const m = cov.get(c.id), acts = activitiesFor(c.id), covered = m ? m.size : 0;
    const pct = total ? Math.round(100 * covered / total) : 0, per = countBySubject(m);
    return `<article class="card child-card">
      <header class="cc-head"><span class="avatar lg" aria-hidden="true">${esc(c.animal)}</span>
        <div class="cc-id"><h2>${esc(c.name)}</h2><p class="meta">${esc(t('n_acts', acts.length))}${acts[0] ? ' · ' + esc(t('last', fmtDate(acts[0].date))) : ''}</p></div>
        <div class="cc-pct"><strong>${pct}<small>%</small></strong><span>${esc(t('x_of_y_goals', covered, total))}</span></div></header>
      <ul class="bars">${SUBJECTS.map(s => barRow(sName(s.key), s.key, per[s.key] || 0, totals[s.key] || 0)).join('')}</ul>
      <footer class="cc-foot"><button class="btn small ghost" data-action="open-child" data-id="${esc(c.id)}">${bt('goals_per_subject')}</button><button class="btn small ghost w" data-action="new-activity" data-child="${esc(c.id)}">${bt('add_activity')}</button></footer>
    </article>`;
  }).join('')}</div>`;
  return h;
}

  const m = cov.get(c.id) || new Map(), totals = subjectTotals(), total = data.goals.size;

    </section>`;

      <summary><span class="dot" style="--c:${sv(s.key)}"></span><h2>${esc(sName(s.key))}</h2><span class="bar"><i style="width:${tot ? Math.round(100 * n / tot) : 0}%;background:${sv(s.key)}"></i></span><span class="b-num">${n}/${tot}</span></summary>

        const via = m.get(g.id);
        return `<li class="${via ? 'done' : ''}"><span class="mark" role="img" aria-label="${esc(via ? t('achieved') : t('open'))}"></span><span class="code" style="--c:${sv(g.subject)}">${esc(g.code || '—')}</span>
          <div class="g-body">${gCat(g) ? `<p class="g-meta">${esc(gCat(g))}</p>` : ''}<p class="g-desc">${esc(gDesc(g))}</p>${via ? `<p class="via">${esc(t('via'))} ${via.map(a => `${esc(a.title)} (${esc(fmtDate(a.date))})`).join(', ')}</p>` : ''}</div></li>`;
      }).join('') : `<li><span></span><span></span><p class="muted">${esc(t('all_done'))}</p></li>`}</ul>
    </details>`;
  }
  if (acts.length) h += `<h2>${esc(t('child_acts', c.name))}</h2><div class="act-list">${acts.map(activityCard).join('')}</div>`;
  return h;
}

function goalChip(g) { return `<li class="code goal-chip" style="--c:${sv(g.subject)}" data-gid="${esc(g.id)}" tabindex="0" aria-label="${esc(`${g.code} ${sName(g.subject)}: ${gDesc(g)}`)}"><span class="dot"></span>${esc(g.code || sName(g.subject))}</li>`; }

/* Up to six thumbnails; the sixth carries a "+n" overlay when there are more. */

function activityCard(a) {

    <div class="act-body"><h3>${esc(a.title)}</h3>
      ${kids.length ? `<p class="act-kids">${kids.map(k => `<span><span class="avatar sm" aria-hidden="true">${esc(k.animal)}</span>${esc(k.name)}</span>`).join('')}</p>` : ''}
      ${goals.length ? `<ul class="goal-chips" aria-label="${esc(t('goals_aria'))}">${goals.slice(0, maxChips).map(goalChip).join('')}${goals.length > maxChips ? `<li class="code">+${goals.length - maxChips}</li>` : ''}</ul>` : `<p class="meta">${esc(t('no_goals_linked'))}</p>`}
      ${photoStrip(a)}

}

function viewActivities() {
  const kids = sortedChildren(), q = norm(ui.actSearch);
  if (ui.actChild && !data.children.has(ui.actChild)) ui.actChild = '';
  const acts = [...data.activities.values()].filter(a =>

  ).sort(byDateDesc);

  }

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDialog(html, mount) {
  dlg.innerHTML = html;
  if (typeof dlg.showModal === 'function') { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  mount && mount(dlg);
  const first = dlg.querySelector('[autofocus]'); if (first) first.focus();
}
function closeDialog() { if (dlg2.open) dlg2.close(); if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) closeDialog(); });
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });
const dlg2 = $('#dlg2');
dlg2.addEventListener('click', e => { if (e.target === dlg2 || e.target.closest('[data-close]')) dlg2.close(); });
dlg2.addEventListener('close', () => { dlg2.innerHTML = ''; });

function shell(id, title, body, submitLabel = t('save'), extraClass = '') {
  return `<form class="dlg-form" id="${id}" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close>${esc(t('close'))}</button></header>
    <div class="dlg-body">${body}</div>
    <footer><p class="form-error" role="alert"></p><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button>${submitLabel ? `<button type="submit" class="btn ${extraClass || 'primary'}">${esc(submitLabel)}</button>` : ''}</footer>
  </form>`;
}
function bindSubmit(d, handler) {
  const form = d.querySelector('form'), err = d.querySelector('.form-error'), btn = form.querySelector('[type=submit]');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = t('busy');
    try {
      const msg = await handler(form, (txt) => { btn.textContent = txt; });
      if (typeof msg === 'string') { err.textContent = msg; return; }
      closeDialog();
    } catch (ex) { err.textContent = errMsg(ex); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
  });
}
function confirmDialog(title, bodyHtml, confirmLabel, onConfirm) {
  openDialog(shell('f-confirm', title, bodyHtml, confirmLabel, 'danger'), d => bindSubmit(d, async () => { await onConfirm(); }));
}

/* child */
function childDialog(child) {
  const used = new Set([...data.children.values()].filter(c => !child || c.id !== child.id).map(c => c.animal));
  const free = ANIMALS.filter(a => !used.has(a));
  const current = child ? child.animal : (free.length ? free[Math.floor(Math.random() * free.length)] : ANIMALS[0]);
  const body = `<label class="field"><span>${esc(t('name'))}</span><input id="c-name" name="name" maxlength="80" autocomplete="off" required autofocus value="${esc(child?.name || '')}"></label>
    <div class="field"><span class="field-label">${esc(t('animal'))}</span><div class="animal-grid" role="radiogroup" aria-label="${esc(t('animal'))}">
      ${ANIMALS.map((a, i) => `<label title="${used.has(a) ? esc(t('animal_taken')) : ''}"><input type="radio" name="animal" id="c-an-${i}" value="${esc(a)}" ${a === current ? 'checked' : ''} ${used.has(a) && free.length ? 'disabled' : ''}>${esc(a)}</label>`).join('')}
    </div></div>`;
  openDialog(shell('f-child', child ? t('child_edit_h') : t('child_add_h'), body), d => {
    bindSubmit(d, async form => {
      const name = form.name.value.trim();
      if (!name) return t('err_name');
      const dup = [...data.children.values()].some(c => (!child || c.id !== child.id) && c.name.localeCompare(name, 'nl', { sensitivity: 'accent' }) === 0);
      if (dup) return t('err_dup_name', name);
      const animal = form.querySelector('input[name=animal]:checked')?.value || current;
      const now = Date.now();
      await put('children', child?.id || newId(), { ...(child ? bodyOf(child) : { createdAt: now }), name, animal, updatedAt: now, example: false });
      toast(child ? t('saved_changes') : t('child_added', name));
    });
  });
}
function deleteChild(id) {
  const c = data.children.get(id); if (!c) return;
  const affected = [...data.activities.values()].filter(a => a.childIds.includes(id));
  confirmDialog(t('child_del_h'), `<p>${t('child_del_q', esc(c.name))}</p><p class="muted">${esc(affected.length ? t('child_del_acts', c.name, affected.length) : t('child_del_none'))}</p>`, t('delete'), async () => {
    const errors = await runPool(affected, a => put('activities', a.id, { ...bodyOf(a), childIds: a.childIds.filter(x => x !== id), updatedAt: Date.now() }));
    if (errors.length) throw errors[0];
    await remove('children', id);
    if (ui.childId === id) { ui.view = 'overzicht'; ui.childId = null; }
    toast(t('child_deleted', c.name));
  });
}

/* goal */

      <label class="field"><span>${esc(t('subject'))}</span><select id="g-subject" name="subject">${SUBJECTS.map(s => `<option value="${s.key}" ${(goal?.subject || ui.lastSubject || 'NL') === s.key ? 'selected' : ''}>${esc(sName(s.key))}</option>`).join('')}</select></label></div>

function deleteGoal(id) {

    await remove('goals', id);

/* activity */
function activityDialog(act, presetChild) {
  const kids = sortedChildren();
  if (!kids.length) { toast(t('add_child_first'), true); return; }
  const selGoals = new Set(act ? act.goalIds.filter(id => data.goals.has(id)) : []);
  const preKids = new Set(act ? act.childIds : (presetChild ? [presetChild] : (kids.length === 1 ? [kids[0].id] : [])));
  const body = `<label class="field"><span>${esc(t('title'))}</span><input id="a-title" name="title" maxlength="200" autocomplete="off" placeholder="${esc(t('title_ph'))}" autofocus value="${esc(act?.title || '')}"></label>
    <label class="field"><span>${esc(t('date'))}</span><input id="a-date" name="date" type="date" value="${esc(act?.date || todayIso())}"></label>
    <div class="field"><span class="field-label">${esc(t('who'))}</span><div class="kid-picks">${kids.map(k => `<label class="kid-pick"><input type="checkbox" name="kids" value="${esc(k.id)}" ${preKids.has(k.id) ? 'checked' : ''}><span class="avatar sm" aria-hidden="true">${esc(k.animal)}</span>${esc(k.name)}</label>`).join('')}</div></div>
    <div class="field"><span class="field-label">${esc(t('goals_field'))} <span class="muted" id="a-count"></span></span>
      <div class="goal-field"><div class="sel-chips" id="a-sel"></div>${data.goals.size ? `<button type="button" class="btn small" id="a-pick">${esc(t('pick_btn'))}</button>` : `<p class="muted">${esc(t('picker_empty'))}</p>`}</div>
    </div>
    <div class="field"><span class="field-label">${esc(t('photos'))} <span class="muted" id="a-pcount"></span></span>
      <div class="photo-edit" id="a-photos"></div>
      <p class="hint" id="a-phint">${esc(t('photo_hint'))}</p>
    </div>
    <label class="field"><span>${esc(t('notes'))}</span><textarea id="a-notes" name="notes" rows="3" maxlength="4000" placeholder="${esc(t('notes_ph'))}">${esc(act?.notes || '')}</textarea></label>`;
  openDialog(shell('f-act', act ? t('act_edit_h') : t('act_add_h'), body), d => {
    const selBox = d.querySelector('#a-sel'), count = d.querySelector('#a-count');
    const chosenKids = () => [...d.querySelectorAll('input[name=kids]:checked')].map(i => i.value);
    function drawSel() {
      count.textContent = selGoals.size ? t('n_chosen', selGoals.size) : '';
      const chosen = [...selGoals].map(id => data.goals.get(id)).filter(Boolean).sort(byGoalOrder);
      selBox.innerHTML = chosen.length
        ? chosen.map(g => `<button type="button" class="code" style="--c:${sv(g.subject)}" data-gid="${esc(g.id)}" title="${esc(t('remove_x', g.code || gDesc(g).slice(0, 40)))}">${esc(g.code || gDesc(g).slice(0, 24))}</button>`).join('')
        : `<span class="muted">${esc(t('none_chosen'))}</span>`;
    }
    selBox.addEventListener('click', e => { const b = e.target.closest('[data-gid]'); if (!b) return; selGoals.delete(b.dataset.gid); drawSel(); });
    d.querySelector('#a-pick')?.addEventListener('click', () => goalPicker(selGoals, chosenKids(), picked => {
      selGoals.clear(); for (const id of picked) selGoals.add(id); drawSel();
    }));
    drawSel();

    /* photos: new ones live in memory until the activity is saved */
    const photos = (act ? act.photoIds : []).map(id => ({ id, existing: true }));
    const pbox = d.querySelector('#a-photos'), pcount = d.querySelector('#a-pcount'), phint = d.querySelector('#a-phint');
    let processing = 0;
    function drawPhotos() {
      pcount.textContent = photos.length ? `· ${photos.length}` : '';
      pbox.innerHTML = photos.map((p, i) => `<span class="pe">${p.url ? `<img src="${esc(p.url)}" alt="">` : photoImg(p.id)}<button type="button" class="pe-x" data-pi="${i}" aria-label="${esc(t('photo_remove'))}">×</button></span>`).join('')
        + (photos.length < MAX_PHOTOS ? `<label class="photo-add">+ ${esc(t('add_photos'))}<input type="file" id="a-file" accept="image/*" multiple></label>` : '');
      hydratePhotos(pbox);
    }
    async function addFiles(list) {
      const files = [...list].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name));
      const room = MAX_PHOTOS - photos.length;
      if (files.length > room) toast(t('photo_max', MAX_PHOTOS), true);
      let failed = 0;
      processing++; phint.textContent = t('photo_processing');
      for (const f of files.slice(0, Math.max(0, room))) {
        try { const rec = await processImage(f); if (!dlg.contains(pbox)) return; photos.push({ id: newId(), rec, url: b64ToUrl(rec), existing: false }); drawPhotos(); }
        catch (e) { failed++; }
      }
      processing--; if (!processing) phint.textContent = t('photo_hint');
      if (failed) toast(t('photo_fail', failed), true);
    }
    pbox.addEventListener('change', e => { if (e.target.id === 'a-file' && e.target.files.length) addFiles(e.target.files); });
    pbox.addEventListener('click', e => {
      const x = e.target.closest('[data-pi]'); if (!x) return;
      const [p] = photos.splice(Number(x.dataset.pi), 1);
      if (p && !p.existing && p.url) URL.revokeObjectURL(p.url);
      drawPhotos();
    });
    const dz = d.querySelector('.dlg-body');
    dz.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { e.preventDefault(); dz.classList.add('drop'); } });
    dz.addEventListener('dragleave', e => { if (!dz.contains(e.relatedTarget)) dz.classList.remove('drop'); });
    dz.addEventListener('drop', e => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); dz.classList.remove('drop'); addFiles(e.dataTransfer.files); });
    d.querySelector('form').addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/')); if (fs.length) { e.preventDefault(); addFiles(fs); } });
    drawPhotos();

    bindSubmit(d, async form => {
      const title = form.title.value.trim(), date = form.date.value, childIds = chosenKids();
      if (!title) return t('err_title');
      if (!validDate(date)) return t('err_date');
      if (!childIds.length) return t('err_kids');
      if (processing) return t('photo_wait');
      const now = Date.now();
      const fresh = photos.filter(p => !p.existing);
      const errors = await runPool(fresh, p => photoStore.put(p.id, { ...p.rec, createdAt: now }), 3);
      if (errors.length) throw errors[0];
      for (const p of fresh) { photoUrl.set(p.id, p.url); p.existing = true; }
      await put('activities', act?.id || newId(), { ...(act ? bodyOf(act) : { createdAt: now }), title, date, notes: form.notes.value, childIds, goalIds: [...selGoals], photoIds: photos.map(p => p.id), updatedAt: now, example: false });
      const removed = (act ? act.photoIds : []).filter(id => !photos.some(p => p.id === id));
      await runPool(removed, deletePhoto, 3);
      if (fresh.length && mode === 'local') navigator.storage?.persist?.().catch(() => {});

/* ---------- import ---------- */
function detectDelim(text) {
  const line = text.split(/\r?\n/).find(l => l.trim()) || '';
  let best = ',', n = -1;
  for (const d of ['\t', ';', ',']) { const c = line.split(d).length - 1; if (c > n) { n = c; best = d; } }
  return best;
}
function parseRows(text, delim) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell.trim() === '') { q = true; cell = ''; }
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function parseGoalImport(text) {
  const tx = text.replace(/^﻿/, '').trim();
  const out = { items: [], errors: [] };
  if (!tx) return out;
  let records = [];
  if (tx[0] === '[' || tx[0] === '{') {
    try {
      let arr = JSON.parse(tx);
      if (!Array.isArray(arr)) arr = Array.isArray(arr.goals) ? arr.goals : [];
      records = arr.map((o, i) => ({ line: i + 1, code: o?.code ?? o?.enumeration ?? '', subject: o?.subject ?? o?.vak ?? '', category: o?.category ?? o?.categorie ?? '', description: o?.description ?? o?.omschrijving ?? '' }));
    } catch (e) { out.errors.push(t('e_json')); return out; }
  } else {
    const rows = parseRows(tx, detectDelim(tx));
    const head = rows[0].map(c => flat(c));
    const find = names => head.findIndex(x => names.includes(x));
    const hc = { code: find(['code', 'nummer', 'nr', 'enumeration', 'doelcode', 'id']), subject: find(['vak', 'subject', 'leergebied', 'domein', 'vakgebied', 'leerdomein']), category: find(['categorie', 'category', 'rubriek', 'subdomein', 'cluster', 'thema']), description: find(['omschrijving', 'description', 'doel', 'tekst', 'beschrijving', 'minimumdoel']) };
    let map, start = 0, headed = false;
    if (hc.subject >= 0 && hc.description >= 0) { map = hc; start = 1; headed = true; }
    else if (rows[0].length >= 4) map = { code: 0, subject: 1, category: 2, description: 3 };
    else if (rows[0].length === 3) map = { code: 0, subject: 1, category: -1, description: 2 };
    else { out.errors.push(t('e_cols')); return out; }
    for (let i = start; i < rows.length; i++) {
      const r = rows[i], g = k => map[k] >= 0 ? (r[map[k]] || '').trim() : '';
      // without a header, an unquoted description containing the delimiter spills into extra columns: glue them back
      const description = headed ? g('description') : r.slice(map.description).join(', ').trim();
      records.push({ line: i + 1, code: g('code'), subject: g('subject'), category: g('category'), description });
    }
  }
  const seen = new Map();
  for (const r of records) {
    const subject = matchSubject(r.subject);
    if (!subject) { out.errors.push(t('e_subject', r.line, String(r.subject).slice(0, 40))); continue; }
    const description = String(r.description || '').trim();
    if (!description) { out.errors.push(t('e_desc', r.line)); continue; }
    const item = { code: String(r.code || '').trim().slice(0, 40), subject, category: String(r.category || '').trim().slice(0, 200), description: description.slice(0, 4000) };
    seen.set(goalKey(item), item);
  }
  out.items = [...seen.values()];
  return out;
}
const goalKey = g => g.code ? `${g.subject}|c|${g.code.toLowerCase()}` : `${g.subject}|d|${flat(g.description)}`;

function importDialog() {
  const body = `<p>${t('import_p')}</p>

const peek = $('#peek'), peekImg = peek.querySelector('img');
let peekFor = null;
function showPeek(th) {
  const img = th.querySelector('img');
  if (!img || !img.complete || !img.naturalWidth) return;
  peekFor = th;
  const vw = window.innerWidth, vh = window.innerHeight, r = th.getBoundingClientRect();
  const s = Math.min(Math.min(440, vw - 32) / img.naturalWidth, Math.min(440, vh - 32) / img.naturalHeight);
  const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  let left = r.right + 12;
  if (left + w > vw - 16) left = r.left - 12 - w;
  if (left < 16) left = Math.max(16, (vw - w) / 2);
  const top = Math.min(Math.max(16, r.top + r.height / 2 - h / 2), vh - 16 - h);
  peekImg.src = img.src;
  Object.assign(peek.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
  peek.hidden = false;
  requestAnimationFrame(() => { if (peekFor === th) peek.classList.add('show'); });
}
function hidePeek() { peekFor = null; peek.classList.remove('show'); peek.hidden = true; hideGoalPeek(); }

/* ---------- Firebase accounts ----------
   Each account's data lives under users/{uid}/{children|activities|goals|photos}/{id}; the
   Firestore rules only let that account read or write it. firestoreStore() exposes the same small
   interface as the Claude-hosted store, so the rest of the app runs unchanged in mode 'db'. */
let fb = null, fbUser = null, unsubs = [];
const ui_auth = { view: 'login', email: '', msg: '', err: '' };

async function startFirebase() {
  try {
    const [appM, authM, fsM] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(FIREBASE_SDK + f)));
    const cfg = { ...FIREBASE_CONFIG }, emu = cfg.emulator; delete cfg.emulator;
    const app = appM.initializeApp(cfg);
    const auth = authM.getAuth(app);
    let fs;
    try { fs = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch (e) { fs = fsM.getFirestore(app); }
    if (emu) { authM.connectAuthEmulator(auth, emu.auth, { disableWarnings: true }); fsM.connectFirestoreEmulator(fs, emu.host, emu.port); }
    fb = { auth, fs, A: authM, F: fsM };
    authM.onAuthStateChanged(auth, user => { if (user) enterAccount(user); else leaveAccount(); });
  } catch (e) {
    mode = 'auth'; ui_auth.err = t('sdk_fail'); render();
  }
}
function fbErr(e) {
  const map = { 'permission-denied': 'invalid_argument', 'resource-exhausted': 'quota_exceeded', 'unauthenticated': 'revoked', 'invalid-argument': 'invalid_argument' };
  const err = new Error(e && e.message); err.code = map[e && e.code] || 'unavailable'; err.fbCode = e && e.code;
  return err;
}
function firestoreStore(uid) {
  const { F, fs } = fb;
  const col = c => F.collection(fs, 'users', uid, c);
  const ref = (c, id) => F.doc(fs, 'users', uid, c, id);
  const snap = d => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  /* Writes apply locally at once and sync in the background; offline they would never resolve,
     so stop waiting after a moment and report a later rejection as a toast. */
  const settle = p => new Promise((resolve, reject) => {
    let waiting = true;
    const timer = setTimeout(() => { waiting = false; resolve(); }, 2500);
    p.then(() => { if (waiting) { clearTimeout(timer); resolve(); } },
      e => { if (waiting) { clearTimeout(timer); reject(fbErr(e)); } else toast(t('late_write_fail'), true); });
  });
  const docApi = (c, id) => ({
    set: d => settle(F.setDoc(ref(c, id), d)),
    delete: () => settle(F.deleteDoc(ref(c, id))),
    get: () => F.getDoc(ref(c, id)).then(snap, e => { throw fbErr(e); }),
  });
  return {
    collection: c => ({
      doc: id => docApi(c, id),
      onSnapshot: (next, error) => F.onSnapshot(col(c), s => next({ docs: s.docs.map(snap) }), e => error && error(fbErr(e))),
    }),
    doc: path => { const [c, id] = path.split('/'); return docApi(c, id); },
  };
}
function resetData() {
  setGoals(new Map()); data.children = new Map(); data.activities = new Map();
  for (const c of COLS) loaded[c] = false;
}
function subscribeAll() {
  for (const u of unsubs) u();
  unsubs = COLS.map(c => db.collection(c).onSnapshot(s => {
    const m = new Map();
    for (const doc of s.docs) { if (!doc.exists) continue; const b = clean(c, doc.data()); if (b) m.set(doc.id, { ...b, id: doc.id }); }
    if (c === 'goals') setGoals(m); else data[c] = m;
    loaded[c] = true; scheduleRender();
  }, err => {
    loaded[c] = true; scheduleRender();
    toast(err && err.code === 'revoked' ? t('err_revoked') : t('err_conn'), true);
  }));
}
function enterAccount(user) {
  if (fbUser && fbUser.uid === user.uid) return;
  fbUser = user; db = firestoreStore(user.uid);
  mode = 'db'; canWrite = true; canWriteKnown = true;
  resetData(); closeDialog(); render(); subscribeAll();
  readLocalSummary();
}
function leaveAccount() {
  for (const u of unsubs) u();
  unsubs = []; fbUser = null; db = null;
  resetData(); closeDialog();
  mode = 'auth'; render();
}

/* login / sign-up / reset screen */
function authView() {
  const v = ui_auth.view;
  const head = { login: ['auth_h', 'auth_p'], signup: ['signup_h', 'signup_p'], reset: ['reset_h', 'reset_p'] }[v];
  const pw = v === 'reset' ? '' : `<label class="field"><span>${esc(t('password'))}</span><input id="au-pw" name="password" type="password" autocomplete="${v === 'signup' ? 'new-password' : 'current-password'}" required></label>`;
  const pw2 = v === 'signup' ? `<label class="field"><span>${esc(t('password2'))}</span><input id="au-pw2" name="password2" type="password" autocomplete="new-password" required><span class="hint">${esc(t('pw_hint'))}</span></label>` : '';
  const submit = { login: 'login', signup: 'signup', reset: 'reset_btn' }[v];
  const links = v === 'login'
    ? `<button type="button" class="linkish" data-action="auth-view" data-v="signup">${bt('to_signup')}</button><button type="button" class="linkish" data-action="auth-view" data-v="reset">${bt('forgot')}</button>`
    : `<button type="button" class="linkish" data-action="auth-view" data-v="login">${bt(v === 'signup' ? 'to_login' : 'back_login')}</button>`;
  return `<section class="card auth">
    <div><h1>${esc(t(head[0]))}</h1><p class="lede">${esc(t(head[1]))}</p></div>
    <form id="auth-form" novalidate>
      <label class="field"><span>${esc(t('email'))}</span><input id="au-email" name="email" type="email" autocomplete="email" inputmode="email" required value="${esc(ui_auth.email)}"></label>
      ${pw}${pw2}
      <p class="form-error" id="au-err" role="alert">${esc(ui_auth.err)}</p>
      ${ui_auth.msg ? `<p class="info" role="status">${esc(ui_auth.msg)}</p>` : ''}
      <button class="btn primary" type="submit" ${fb ? '' : 'disabled'}>${bt(submit)}</button>
    </form>
    <div class="auth-links">${links}</div>
    <p class="privacy">${esc(t('privacy'))}</p>
  </section>`;
}
function authErr(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login-credentials|missing-password/.test(c)) return t('ae_invalid');
  if (c.includes('email-already-in-use')) return t('ae_inuse');
  if (/invalid-email|missing-email/.test(c)) return t('ae_email');
  if (c.includes('weak-password')) return t('ae_weak');
  if (c.includes('too-many-requests')) return t('ae_many');
  if (c.includes('network-request-failed')) return t('ae_net');
  return t('ae_generic');
}
async function submitAuth(form) {
  if (!fb) return;
  const { A, auth } = fb, v = ui_auth.view;
  const email = form.email.value.trim(), err = form.querySelector('#au-err'), btn = form.querySelector('[type=submit]');
  ui_auth.email = email; ui_auth.err = ''; ui_auth.msg = '';
  err.textContent = '';
  form.querySelector('.info')?.remove();
  if (!email) { err.textContent = t('err_email_empty'); return; }
  if (v === 'signup') {
    if (form.password.value.length < 8) { err.textContent = t('err_pw_short'); return; }
    if (form.password.value !== form.password2.value) { err.textContent = t('err_pw_match'); return; }
  }
  const label = btn.textContent; btn.disabled = true; btn.textContent = t('busy');
  try {
    if (v === 'login') await A.signInWithEmailAndPassword(auth, email, form.password.value);
    else if (v === 'signup') await A.createUserWithEmailAndPassword(auth, email, form.password.value);
    else {
      auth.languageCode = lang;
      await A.sendPasswordResetEmail(auth, email);
      ui_auth.msg = t('reset_sent'); render();
    }
  } catch (e) {
    if (btn.isConnected) { err.textContent = authErr(e); btn.disabled = false; btn.textContent = label; }
    return;
  }
  if (btn.isConnected) { btn.disabled = false; btn.textContent = label; }
}
/* Signing out also wipes this browser's offline copy of the account, so the next person on a
   shared computer finds nothing. */
async function logout() {
  if (!fb) return;
  try { await fb.A.signOut(fb.auth); } catch (e) {}
  try { await fb.F.terminate(fb.fs); await fb.F.clearIndexedDbPersistence(fb.fs); } catch (e) { console.warn('doelenboek: could not clear offline copy', e && e.code, e && e.message); }
  location.reload();
}
function deleteAccountDialog() {
  const body = `<p>${esc(t('del_acc_p'))}</p><label class="field"><span>${esc(t('del_acc_confirm'))}</span><input id="da-pw" name="password" type="password" autocomplete="current-password" autofocus></label>`;
  openDialog(shell('f-delacc', t('del_acc'), body, t('del_acc_btn'), 'danger'), d => bindSubmit(d, async form => {
    const { A, F, auth, fs } = fb, user = auth.currentUser;
    if (!user) return t('ae_generic');
    try { await A.reauthenticateWithCredential(user, A.EmailAuthProvider.credential(user.email, form.password.value)); }
    catch (e) { return authErr(e); }
    for (const c of [...COLS, 'photos']) {
      const s = await F.getDocs(F.collection(fs, 'users', user.uid, c));
      const errors = await runPool(s.docs, docSnap => F.deleteDoc(docSnap.ref), 6);
      if (errors.length) throw fbErr(errors[0]);
    }
    try { await A.deleteUser(user); } catch (e) { return authErr(e); }
    try { localStorage.removeItem(MIGRATED_KEY + user.uid); } catch (e) {}
    try { await F.terminate(fs); await F.clearIndexedDbPersistence(fs); } catch (e) {}
    toast(t('del_done'));
    setTimeout(() => location.reload(), 600);
  }));
}

/* One-time offer to move data saved in this browser (before accounts existed) into the account. */
let localSummary = null;
function readLocalSummary() {
  localSummary = null;
  try {
    const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!o) return;
    const n = c => Object.keys(o[c] || {}).length;
    if (n('children') + n('activities') + n('goals')) localSummary = { o, children: n('children'), activities: n('activities') };
  } catch (e) {}
}
function migrationNotice() {
  if (!fbUser || !localSummary) return '';
  try { if (localStorage.getItem(MIGRATED_KEY + fbUser.uid)) return ''; } catch (e) { return ''; }
  if (data.children.size || data.activities.size || customGoals.size) return '';
  return `<div class="notice"><p>${esc(t('mig_p', localSummary.children, localSummary.activities))}</p><span class="head-actions"><button class="btn small" data-action="migrate">${bt('mig_btn')}</button><button class="btn small" data-action="migrate-skip">${bt('mig_skip')}</button></span></div>`;
}
function markMigrated() { try { localStorage.setItem(MIGRATED_KEY + fbUser.uid, todayIso()); } catch (e) {} scheduleRender(); }
async function migrateLocal(btn) {
  const o = localSummary && localSummary.o; if (!o || !fbUser) return;
  btn.disabled = true;
  const docs = [];
  for (const c of COLS) for (const [id, v] of Object.entries(o[c] || {})) { if (!ID_RE.test(id) || (c === 'goals' && BUILTIN.has(id))) continue; const b = clean(c, v); if (b) docs.push({ c, id, b }); }
  const used = new Set(docs.filter(x => x.c === 'activities').flatMap(x => x.b.photoIds));
  let photos = [];
  try { photos = used.size ? (await localPhotosAll()).filter(p => used.has(p.id)) : []; } catch (e) {}
  const total = docs.length + photos.length;
  let n = 0;
  const step = () => { btn.textContent = t('progress', ++n, total); };
  const errors = await runPool(photos, async p => { await photoStore.put(p.id, p.rec); step(); }, 3);
  errors.push(...await runPool(docs, async x => { await put(x.c, x.id, x.b); step(); }, 4));
  if (errors.length) { toast(t('r_partial', errors.length, total, errMsg(errors[0])), true); btn.disabled = false; btn.textContent = t('mig_btn'); return; }
  markMigrated();
  toast(t('mig_done', total));
}

/* ---------- start ---------- */
function startLocal() {
  mode = 'local'; loadLocal(); render();
}
async function init() {
  fromHash();
  if (FIREBASE_CONFIG) { render(); startFirebase(); return; }
  if (!window.claude || typeof window.claude.use !== 'function') { startLocal(); return; }
  let d = null, u = null;
  try { [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }
  catch (e) { d = null; }
  if (!d) { startLocal(); toast(t('err_no_shared'), true); return; }
  db = d; mode = 'db';
  if (u) { try { const c = await u.can('data.write'); if (c === true || c === false) { canWrite = c; canWriteKnown = true; } } catch (e) {} }
  render();
  subscribeAll();
}
init();
})();
</script>
